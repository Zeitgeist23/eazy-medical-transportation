name: Activate background ride submission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-background-ride-submit.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ride request code
        run: |
          node --check ride-submit-background.js
          node --check api/ride-request.mjs
      - name: Bump homepage menu loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='menu-fix.js?v=14'
          new='menu-fix.js?v=15'
          if old not in s:
              raise SystemExit('Expected menu loader version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/activate-background-ride-submit.yml
          git add index.html
          git commit -m "Activate background ride request submission"
          git push origin HEAD:main
