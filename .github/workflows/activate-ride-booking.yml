name: Activate live ride request workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-ride-booking.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='menu-fix.js?v=12'
          new='menu-fix.js?v=13'
          if old not in s:
              raise SystemExit('Expected homepage menu loader version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/activate-ride-booking.yml
          git add index.html
          git commit -m "Activate live ride request workflow"
          git push origin HEAD:main
