name: Adjust provider popup proportions

on:
  push:
    branches:
      - adjust-provider-popup-proportions
    paths:
      - .github/workflows/adjust-provider-popup-proportions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adjust-provider-popup-proportions
      - name: Patch popup dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('provider-cards-live.js')
          s = p.read_text()
          old_modal = '#modal.provider-popup-large .modal{width:min(1040px,96vw);max-height:90vh}'
          new_modal = '#modal.provider-popup-large .modal{width:min(940px,94vw);max-height:94vh}'
          old_preview = '.provider-popup-site{width:100%;height:310px;border:1px solid #d7e7eb;border-radius:16px;overflow:hidden;background:#f8fbfc;margin-bottom:18px}'
          new_preview = '.provider-popup-site{width:100%;height:360px;border:1px solid #d7e7eb;border-radius:16px;overflow:hidden;background:#f8fbfc;margin-bottom:18px}'
          if old_modal not in s:
              raise SystemExit('Expected modal sizing rule not found; aborting without changes')
          if old_preview not in s:
              raise SystemExit('Expected preview sizing rule not found; aborting without changes')
          s = s.replace(old_modal, new_modal, 1).replace(old_preview, new_preview, 1)
          p.write_text(s)
          PY
      - name: Commit popup sizing repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider-cards-live.js
          git diff --cached --quiet && exit 0
          git commit -m "Refine provider popup proportions"
          git push origin HEAD:adjust-provider-popup-proportions
