name: Apply Eazy ride request issue

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN EAZY RIDE REQUEST PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch site
        run: python scripts/add_ride_request_flow.py
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add provider ride request flow"
          git push
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}"
