name: Apply provider claim layer

on:
  push:
    paths:
      - '.github/workflows/apply-provider-claim-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply provider claim system
        run: python scripts/add_provider_claims.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add provider claims and direct ride routing"
          git push
