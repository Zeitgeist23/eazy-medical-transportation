name: Bake header logo

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build header logo from exact uploaded artwork
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import base64

          # Exact non-generative header logo derived from the user's uploaded PNG.
          payload = ''''''
          logo_bytes = base64.b64decode(payload)
          Path('header-logo-source.png').write_bytes(logo_bytes)

          landing = Path('directory-landing-approved.png')
          im = Image.open(landing).convert('RGBA')
          logo = Image.open('header-logo-source.png').convert('RGBA')

          # Preserve the current page exactly except the existing top-left brand text area.
          # Coordinates are proportional to the 1448x1086 approved artwork.
          if im.size != (1448,1086):
              raise SystemExit(f'Unexpected landing image size: {im.size}')

          # Clear only the baked EazyMedicalTransportation.com text area to white.
          clear_box = (52, 45, 385, 92)
          white = Image.new('RGBA', (clear_box[2]-clear_box[0], clear_box[3]-clear_box[1]), (255,255,255,255))
          im.paste(white, (clear_box[0], clear_box[1]))

          # Fit exact logo artwork in the same header band, no generative edits.
          target_h = 44
          scale = target_h / logo.height
          target_w = round(logo.width * scale)
          logo = logo.resize((target_w, target_h), Image.Resampling.LANCZOS)
          x, y = 58, 46
          im.alpha_composite(logo, (x, y))
          im.convert('RGB').save(landing, optimize=True)
          Path('header-logo-source.png').unlink()
      - name: Commit landing PNG only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory-landing-approved.png
          git diff --cached --quiet && exit 0
          git commit -m "Place Eazy logo in upper-left header"
          git push origin HEAD:${{ github.head_ref }}
