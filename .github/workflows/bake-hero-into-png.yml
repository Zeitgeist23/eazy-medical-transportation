name: Bake hero into directory PNG

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Bake current replacement scene into underlying PNG
        shell: python
        run: |
          from PIL import Image, ImageFilter, ImageDraw
          from pathlib import Path

          png = Path('directory-landing-approved.png')
          overlay = Path('hero-scene-overlay.webp')
          html = Path('index.html')
          if not png.exists() or not overlay.exists():
              raise SystemExit('Required landing PNG or replacement scene is missing')

          im = Image.open(png).convert('RGB')
          original = im.copy()
          scene = Image.open(overlay).convert('RGB')
          print('landing size:', im.size)
          print('scene source size:', scene.size)
          if im.size != (1448,1086):
              raise SystemExit(f'Unexpected landing image size: {im.size}')

          # Resize the already-approved replacement scene to the exact original hero artwork area.
          target_size = (658,305)
          scene = scene.resize(target_size, Image.Resampling.LANCZOS)
          box = (790,85,1448,390)
          under = im.crop(box)

          # Feather the left seam so the new scene becomes part of the original artwork.
          mask = Image.new('L', target_size, 255)
          d = ImageDraw.Draw(mask)
          feather = 150
          for x in range(feather):
              d.line((x,0,x,target_size[1]), fill=int(255*x/feather))
          mask = mask.filter(ImageFilter.GaussianBlur(7))
          baked = Image.composite(scene, under, mask)
          im.paste(baked, box)

          # Restore every area that is not the right-side hero artwork.
          im.paste(original.crop((0,0,1448,86)), (0,0))
          im.paste(original.crop((0,85,790,390)), (0,85))
          im.paste(original.crop((95,260,915,382)), (95,260))
          im.paste(original.crop((0,390,1448,1086)), (0,390))
          im.save(png, optimize=True)

          # Remove the old second-image overlay architecture completely.
          s = html.read_text()
          s = s.replace('#hero-scene-overlay{position:absolute;left:60.08%;top:7.73%;width:39.92%;height:28.18%;object-fit:fill;z-index:2;pointer-events:none}\n','')
          s = s.replace('    <img id="hero-scene-overlay" src="hero-scene-overlay.webp" alt="">\n','')
          html.write_text(s)
          overlay.unlink()
      - name: Verify true replacement
        run: |
          ! grep -q 'hero-scene-overlay' index.html
          test ! -e hero-scene-overlay.webp
          file directory-landing-approved.png
      - name: Commit baked replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A directory-landing-approved.png index.html hero-scene-overlay.webp
          git diff --cached --quiet && exit 0
          git commit -m "Bake replacement van scene into landing PNG"
          git push origin HEAD:${{ github.head_ref }}
