name: Bake hero into directory PNG

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Fetch verified hero patch blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/blobs/1869f5d384d6bdde592f513dbf8ab6843718b986 --jq .content | tr -d '\n' | base64 -d > hero-bake-patch.webp
          file hero-bake-patch.webp
          test -s hero-bake-patch.webp
      - name: Bake hero scene into existing PNG and remove overlay
        shell: python
        run: |
          from PIL import Image, ImageFilter, ImageDraw
          from pathlib import Path

          png = Path('directory-landing-approved.png')
          im = Image.open(png).convert('RGB')
          original = im.copy()
          patch = Image.open('hero-bake-patch.webp').convert('RGB')
          if im.size != (1448,1086):
              raise SystemExit(f'Unexpected landing image size: {im.size}')
          if patch.size != (658,305):
              raise SystemExit(f'Unexpected patch size: {patch.size}')

          # Replace the original hero-scene pixels themselves. No HTML overlay.
          box = (790,85,1448,390)
          under = im.crop(box)
          mask = Image.new('L', patch.size, 255)
          d = ImageDraw.Draw(mask)
          feather = 135
          for x in range(feather):
              d.line((x,0,x,patch.height), fill=int(255*x/feather))
          mask = mask.filter(ImageFilter.GaussianBlur(5))
          baked = Image.composite(patch, under, mask)
          im.paste(baked, box)

          # Restore every page area that is not part of the right-side hero artwork.
          im.paste(original.crop((0,0,1448,86)), (0,0))
          im.paste(original.crop((0,85,790,390)), (0,85))
          im.paste(original.crop((95,260,915,382)), (95,260))
          im.paste(original.crop((0,390,1448,1086)), (0,390))
          im.save(png, optimize=True)

          # Remove the separate overlay from HTML.
          html = Path('index.html')
          s = html.read_text()
          s = s.replace('#hero-scene-overlay{position:absolute;left:60.08%;top:7.73%;width:39.92%;height:28.18%;object-fit:fill;z-index:2;pointer-events:none}\n','')
          s = s.replace('    <img id="hero-scene-overlay" src="hero-scene-overlay.webp" alt="">\n','')
          html.write_text(s)

          overlay = Path('hero-scene-overlay.webp')
          if overlay.exists(): overlay.unlink()
          Path('hero-bake-patch.webp').unlink()
      - name: Verify overlay is gone
        run: |
          ! grep -q 'hero-scene-overlay' index.html
          test ! -e hero-scene-overlay.webp
          file directory-landing-approved.png
      - name: Commit baked replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A directory-landing-approved.png index.html hero-scene-overlay.webp
          git diff --cached --quiet && exit 0
          git commit -m "Bake replacement van scene into landing PNG"
          git push origin HEAD:${{ github.head_ref }}
