name: Build national NEMT provider database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 16 * *'
  push:
    branches: [main]
    paths:
      - '.provider-db-trigger'

permissions:
  contents: write

concurrency:
  group: national-provider-db
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: git pull --ff-only origin main
      - name: Add organization entity type to provider records
        run: python scripts/patch_entity_type.py
      - name: Build state provider files from latest CMS NPPES monthly V2 dissemination
        run: python scripts/build_national_provider_db.py
      - name: Validate generated database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path('data/provider-index.json').read_text())
          assert len(idx['states']) == 51
          assert idx['totalProviders'] > 0
          il=json.loads(Path('data/providers/IL.json').read_text())
          assert any(p.get('entityType') == '2' for p in il.get('providers', []))
          print('states:',len(idx['states']),'providers:',idx['totalProviders'])
          PY
      - name: Generate crawlable provider profiles
        run: python scripts/generate_provider_pages.py
      - name: Generate browse architecture, city directories, guides and trust pages
        run: python scripts/generate_guides_and_browse.py
      - name: Generate focused secondary sitemaps
        run: python scripts/generate_secondary_sitemaps.py
      - name: Validate SEO output
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('sitemap.xml').read_text()
          required=['browse/index.html','browse/il/chicago/index.html','guides/index.html','claim-provider/index.html','about/index.html','data-sources/index.html','listing-policy/index.html','editorial-policy/index.html','404.html','provider-sitemap.xml','content-sitemap.xml']
          missing=[p for p in required if not Path(p).exists()]
          assert not missing, missing
          assert len(re.findall(r'<loc>',s)) > 160
          ps=Path('provider-sitemap.xml').read_text()
          cs=Path('content-sitemap.xml').read_text()
          assert '/providers/' in ps
          assert '/browse/' in cs or '/guides/' in cs
          print('main sitemap URLs:',len(re.findall(r'<loc>',s)))
          print('provider sitemap URLs:',len(re.findall(r'<loc>',ps)))
          print('content sitemap URLs:',len(re.findall(r'<loc>',cs)))
          PY
      - name: Commit generated provider database and SEO pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_national_provider_db.py states.json data/provider-index.json data/providers/*.json providers browse guides about data-sources listing-policy editorial-policy sitemap.xml provider-sitemap.xml content-sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh NEMT directory, crawl maps, guides and trust pages"
          git pull --rebase origin main
          git push origin main
