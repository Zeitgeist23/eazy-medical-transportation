name: Refresh provider popup loader

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-menu-loader-v12.yml

permissions:
  contents: write

jobs:
  refresh-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump menu loader cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='menu-fix.js?v=11'
          new='menu-fix.js?v=12'
          if old not in s:
              raise SystemExit('Expected menu loader version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit refreshed loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-menu-loader-v12.yml
          git add index.html
          git commit -m "Refresh provider website popup loader"
          git push origin HEAD:main
