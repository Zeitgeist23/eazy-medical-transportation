name: Check live EAZY ride API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-live-ride-api.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel deployment
        run: sleep 15
      - name: Check live API health
        run: |
          echo '--- HEALTH ---'
          curl --fail-with-body --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 https://www.eazymedicaltransportation.com/api/ride-request
      - name: Trigger one-time email relay activation
        run: |
          echo '--- ACTIVATION ---'
          curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 4 --max-time 25 'https://www.eazymedicaltransportation.com/api/ride-request?activate=1'
      - name: Remove temporary production check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-live-ride-api.yml
          git commit -m "Remove temporary live ride API check"
          git push origin HEAD:main
