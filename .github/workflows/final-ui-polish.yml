name: Final UI polish

on:
  push:
    branches: [main]
    paths:
      - '.final-ui-polish-trigger'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-ui-polish
      - name: Polish current UI fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('safe-ui-fixes.js')
          s=p.read_text()

          s=s.replace("const vanSvg='<svg viewBox=\"0 0 32 24\" aria-hidden=\"true\"><path d=\"M4 6h17l5 5v7H4V6Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M21 7v5h5M8 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm14 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>';", "const vanSvg='<svg viewBox=\"0 0 32 24\" aria-hidden=\"true\"><path d=\"M3 9c0-2.2 1.8-4 4-4h13l6 6v8H3V9Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M19 7v6h6M9 8v6M6 11h6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"8\" cy=\"19\" r=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"22\" cy=\"19\" r=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>';" )

          s=s.replace("#service,#accessibility{padding-left:42px!important;padding-right:34px!important;cursor:pointer!important;appearance:none!important}", "#service{padding-left:42px!important;padding-right:30px!important;cursor:pointer!important;appearance:none!important}\\n    #accessibility{padding-left:38px!important;padding-right:20px!important;cursor:pointer!important;appearance:none!important;font-size:clamp(8px,.68vw,12px)!important}")
          s=s.replace(".native-disclaimer{position:absolute;left:23.8%;top:34.08%;width:40.4%;height:2.38%;z-index:14;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;color:#40596b;font:600 clamp(8px,.69vw,13px)/1 Arial,Helvetica,sans-serif;white-space:nowrap;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}", ".native-disclaimer{position:absolute;left:25.6%;top:34.16%;width:38.1%;height:1.78%;z-index:14;background:rgba(255,255,255,.9);backdrop-filter:blur(3px);border-radius:999px;box-shadow:0 0 8px 5px rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;gap:7px;color:#40596b;font:600 clamp(8px,.67vw,12px)/1 Arial,Helvetica,sans-serif;white-space:nowrap;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}")
          s=s.replace(".native-browse-link{position:absolute;left:85.15%;top:40.35%;width:10.4%;height:2.4%;z-index:14;background:#fff;display:flex;align-items:center;justify-content:flex-end;color:#0c5488;font:700 clamp(8px,.68vw,12px)/1 Arial,Helvetica,sans-serif;pointer-events:none;white-space:nowrap;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}", ".native-browse-link{position:absolute;left:85.9%;top:40.45%;width:9.4%;height:1.72%;z-index:14;background:rgba(255,255,255,.9);border-radius:999px;box-shadow:0 0 7px 5px rgba(255,255,255,.55);display:flex;align-items:center;justify-content:flex-end;padding-right:.15%;color:#0c5488;font:700 clamp(8px,.66vw,12px)/1 Arial,Helvetica,sans-serif;pointer-events:none;white-space:nowrap;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}")
          s=s.replace(".native-provider-card{position:absolute;top:43.35%;width:12.45%;height:19.0%;background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:1.0% .45% .6%;pointer-events:none}", ".native-provider-card{position:absolute;top:43.28%;width:12.7%;height:19.22%;background:#fff;border-radius:8px;overflow:hidden;clip-path:inset(1px round 8px);box-shadow:0 0 0 2px #fff inset;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:1.0% .45% .6%;pointer-events:none}")
          s=s.replace("font-weight:800;font-size:clamp(8px,.7vw,13px);line-height:1.12", "font-weight:700;font-size:clamp(8px,.66vw,12px);line-height:1.16")
          s=s.replace("return out.length?out:['NEMT'];", "return out.length?out:['NEMT','Transport Van'];")

          s=s.replace("@media(max-width:760px){.native-field-icon,.native-field-chevron,.native-disclaimer,.native-featured-heading,.native-featured-layer,.native-browse-link{display:none!important}}", ".native-how-heading{position:absolute;left:33.8%;top:63.55%;width:22.6%;height:2.45%;z-index:14;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;color:#0b3552;font:800 clamp(13px,1.05vw,20px)/1 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;pointer-events:none}\\n    @media(max-width:760px){.native-field-icon,.native-field-chevron,.native-disclaimer,.native-featured-heading,.native-featured-layer,.native-browse-link,.native-how-heading{display:none!important}}")
          s=s.replace("const browse=document.createElement('div');browse.className='native-browse-link';browse.textContent='Browse all providers →';root.appendChild(browse);", "const browse=document.createElement('div');browse.className='native-browse-link';browse.textContent='Browse all providers →';root.appendChild(browse);\\n  const how=document.createElement('div');how.className='native-how-heading';how.textContent='How the Directory Works';root.appendChild(how);")
          s=s.replace("let currentCards=[];", "let currentCards=[];\\n  let claimCache=null;\\n  async function getClaims(){if(claimCache)return claimCache;try{const r=await fetch('providers-claimed.json?v=2',{cache:'no-store'});claimCache=r.ok?((await r.json()).claims||{}):{}}catch(_){claimCache={}}return claimCache}")

          old="""  async function loadFeatured(abbr){
    if(!states[abbr])abbr='IL';
    try{const r=await fetch(`data/providers/${abbr}.json?v=cards2`,{cache:'no-store'});if(!r.ok)return;const data=await r.json();const ranked=(data.providers||[]).map(p=>Object.assign({},p,{_tags:tagsFor(p,data)})).sort((a,b)=>Number(b._tags[0]!=='NEMT')-Number(a._tags[0]!=='NEMT')||Number(Boolean(b.phone))-Number(Boolean(a.phone))||String(a.name||'').localeCompare(String(b.name||'')));const cards=ranked.slice(0,6);if(cards.length)renderCards(cards,abbr)}catch(_){}}
"""
          new="""  async function loadFeatured(abbr){
    if(!states[abbr])abbr='IL';
    try{
      const [r,claims]=await Promise.all([fetch(`data/providers/${abbr}.json?v=cards3`,{cache:'no-store'}),getClaims()]);
      if(!r.ok)return;
      const data=await r.json();
      const ranked=(data.providers||[]).map(p=>{
        const merged=Object.assign({},p,claims[String(p.npi)]||{});
        const tags=tagsFor(merged,data);
        const explicit=tags.some(t=>!['NEMT','Transport Van'].includes(t));
        const score=(merged.claimed?100:0)+(explicit?45:0)+(merged.phone?20:0)+(merged.address1?10:0)+(merged.zip?3:0);
        return Object.assign({},merged,{_tags:tags,_score:score});
      }).sort((a,b)=>b._score-a._score||String(a.name||'').localeCompare(String(b.name||'')));
      const cards=ranked.slice(0,6);if(cards.length)renderCards(cards,abbr)
    }catch(_){}
  }
"""
          if old not in s: raise SystemExit('loadFeatured block not found')
          s=s.replace(old,new,1)

          p.write_text(s)
      - name: Validate polish
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('safe-ui-fixes.js').read_text()
          checks=['Transport Van','native-how-heading','getClaims()','padding-right:20px','backdrop-filter:blur(3px)','_score:score']
          for c in checks: assert c in s, c
          assert 'font-weight:800;font-size:clamp(8px,.7vw,13px)' not in s
          print('final UI polish validated')
          PY
      - name: Commit polish to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add safe-ui-fixes.js
          git diff --cached --quiet && exit 0
          git commit -m "Polish search, disclaimer and featured provider UI"
          git push origin final-ui-polish
