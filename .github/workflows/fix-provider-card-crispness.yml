name: Fix provider card crispness

on:
  push:
    branches: [main]
    paths:
      - '.provider-crisp-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-provider-card-crispness
          fetch-depth: 0
      - name: Restore clean pre-sharpen artwork
        run: |
          git fetch origin main --quiet
          git show 9a50aa4f7ad5c5aa320b62bad69a23823f7feaf0:directory-landing-approved.png > directory-landing-approved.png
      - name: Add crisp native provider-card text overlays
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css=r'''
/* Native provider-card text overlay: crisp browser text over the unchanged approved artwork. */
.crisp-provider-layer{position:absolute;inset:0;z-index:6;pointer-events:none;font-family:Arial,Helvetica,sans-serif}
.crisp-provider-layer .pc-name,.crisp-provider-layer .pc-city,.crisp-provider-layer .pc-tags,.crisp-provider-layer .pc-view{position:absolute;text-align:center}
.crisp-provider-layer .pc-name{top:49.45%;width:12.25%;min-height:3.15%;display:flex;align-items:center;justify-content:center;background:#fff;color:#10263b;font-weight:800;font-size:clamp(8px,.78vw,14px);line-height:1.08;padding:0 .2%}
.crisp-provider-layer .pc-city{top:53.25%;width:12.25%;height:1.75%;display:flex;align-items:center;justify-content:center;background:#fff;color:#174b83;font-weight:600;font-size:clamp(7px,.64vw,12px);line-height:1}
.crisp-provider-layer .pc-tags{top:55.55%;width:12.25%;height:2.15%;display:flex;align-items:center;justify-content:center;gap:.6%;background:#fff}
.crisp-provider-layer .pc-tags span{display:inline-flex;align-items:center;justify-content:center;min-width:3.8vw;height:1.55vw;max-height:24px;padding:0 .45vw;border:1px solid #b8e0e8;border-radius:999px;background:#eaf7f9;color:#174b83;font-weight:700;font-size:clamp(7px,.58vw,11px);white-space:nowrap}
.crisp-provider-layer .pc-view{top:59.35%;height:2.8%;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #14899b;border-radius:4px;color:#0b5269;font-weight:800;font-size:clamp(8px,.7vw,13px);line-height:1}
@media(max-width:760px){.crisp-provider-layer{display:none}}
'''
          if 'crisp-provider-layer' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          overlay='''\n  <div class="crisp-provider-layer" aria-hidden="true">\n    <div class="pc-name" style="left:5.35%">North Shore Medical Transport</div><div class="pc-city" style="left:5.35%">⌾ Evanston, IL</div><div class="pc-tags" style="left:5.35%"><span>Wheelchair</span><span>Ambulatory</span></div><div class="pc-view" style="left:6.3%;width:10.3%">View Provider</div>\n    <div class="pc-name" style="left:19.25%">Chicago Senior Ride Services</div><div class="pc-city" style="left:19.25%">⌾ Chicago, IL</div><div class="pc-tags" style="left:19.25%"><span>Ambulatory</span><span>Companion</span></div><div class="pc-view" style="left:20.2%;width:10.5%">View Provider</div>\n    <div class="pc-name" style="left:33.65%">Lake County Wheelchair Transit</div><div class="pc-city" style="left:33.65%">⌾ Waukegan, IL</div><div class="pc-tags" style="left:33.65%"><span>Wheelchair</span><span>Stretcher</span></div><div class="pc-view" style="left:34.6%;width:10.4%">View Provider</div>\n    <div class="pc-name" style="left:47.75%">Suburban Patient Transport</div><div class="pc-city" style="left:47.75%">⌾ Schaumburg, IL</div><div class="pc-tags" style="left:47.75%"><span>Ambulatory</span><span>Wheelchair</span></div><div class="pc-view" style="left:48.7%;width:10.5%">View Provider</div>\n    <div class="pc-name" style="left:61.15%">Metro Dialysis Rides</div><div class="pc-city" style="left:61.15%">⌾ Naperville, IL</div><div class="pc-tags" style="left:61.15%"><span>Dialysis</span><span>Wheelchair</span></div><div class="pc-view" style="left:62.1%;width:10.5%">View Provider</div>\n    <div class="pc-name" style="left:75.15%">Heartland Medical Transit</div><div class="pc-city" style="left:75.15%">⌾ Aurora, IL</div><div class="pc-tags" style="left:75.15%"><span>Ambulatory</span><span>Stretcher</span></div><div class="pc-view" style="left:76.1%;width:10.5%">View Provider</div>\n  </div>'''
          marker='  <img src="directory-landing-approved.png" alt="Independent Medical Transportation Directory">'
          if overlay.strip() not in s:
              s=s.replace(marker,marker+overlay,1)
          p.write_text(s)
      - name: Validate no artwork/layout redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'crisp-provider-layer' in s
          assert s.count('View Provider') >= 6
          assert 'directory-landing-approved.png' in s
          print('native crisp provider overlay installed')
          PY
      - name: Commit fix to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html directory-landing-approved.png
          git diff --cached --quiet && exit 0
          git commit -m "Restore clean provider cards and use crisp native text"
          git push origin fix-provider-card-crispness
