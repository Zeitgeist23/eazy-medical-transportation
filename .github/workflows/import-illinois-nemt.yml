name: Import Illinois NEMT providers

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  import:
    if: github.event.issue.title == 'IMPORT ILLINOIS NEMT PROVIDERS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Illinois NEMT organizations from CMS NPPES
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          from pathlib import Path

          all_results = []
          for skip in range(0, 1200, 200):
              params = {
                  'version':'2.1',
                  'enumeration_type':'NPI-2',
                  'taxonomy_description':'Non-emergency Medical Transport (VAN)',
                  'state':'IL',
                  'address_purpose':'LOCATION',
                  'limit':'200',
                  'skip':str(skip)
              }
              url = 'https://npiregistry.cms.hhs.gov/api/?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent':'EazyMedicalTransportationDirectory/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              batch = data.get('results', [])
              all_results.extend(batch)
              print('skip', skip, 'count', len(batch), 'total', len(all_results))
              if len(batch) < 200:
                  break
              time.sleep(.25)

          providers = []
          seen = set()
          for r in all_results:
              npi = str(r.get('number','')).strip()
              if not npi or npi in seen:
                  continue
              basic = r.get('basic') or {}
              if basic.get('status') and basic.get('status') != 'A':
                  continue
              tax = r.get('taxonomies') or []
              if not any(t.get('code') == '343900000X' for t in tax):
                  continue
              addresses = r.get('addresses') or []
              loc = next((a for a in addresses if a.get('address_purpose') == 'LOCATION' and a.get('state') == 'IL'), None)
              if not loc:
                  continue
              name = (basic.get('organization_name') or '').strip()
              if not name:
                  continue
              seen.add(npi)
              city = (loc.get('city') or '').title()
              state = loc.get('state') or 'IL'
              postal = (loc.get('postal_code') or '')[:5]
              phone = loc.get('telephone_number') or ''
              address1 = (loc.get('address_1') or '').title()
              address2 = (loc.get('address_2') or '').title()
              providers.append({
                  'name': name.title(),
                  'city': city,
                  'state': state,
                  'zip': postal,
                  'address1': address1,
                  'address2': address2,
                  'phone': phone,
                  'npi': npi,
                  'tags': ['NEMT','Medical Transport Van'],
                  'source': 'CMS NPPES',
                  'sourceUrl': f'https://npiregistry.cms.hhs.gov/provider-view/{npi}'
              })

          providers.sort(key=lambda p:(p['city'], p['name']))
          Path('providers-il.json').write_text(json.dumps({'state':'IL','taxonomy':'343900000X','count':len(providers),'providers':providers}, indent=2), encoding='utf-8')
          print('Wrote', len(providers), 'Illinois NEMT organizations')

      - name: Wire Eazy site to Illinois provider database
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = re.search(r"const providers=\[.*?\];", s, re.S)
          if not old:
              raise SystemExit('provider array not found')
          replacement = "let providers=[];\nasync function loadProviders(){try{const r=await fetch('providers-il.json?v=1',{cache:'no-store'});const d=await r.json();providers=d.providers||[];renderFeaturedProviders();}catch(e){console.error('Provider database failed to load',e)}}\nfunction renderFeaturedProviders(){const box=document.querySelector('.provider-list');if(!box||!providers.length)return;box.innerHTML=providers.slice(0,3).map((p,i)=>`<article class=\"provider\"><div class=\"provider-top\"><div><h3>${p.name}</h3><div class=\"city\">${p.city}, ${p.state} ${p.zip||''}</div></div><button class=\"view\" onclick=\"showProvider(${i})\">View</button></div><div class=\"smalltags\"><span>NEMT</span><span>Medical Transport Van</span></div></article>`).join('')}"
          s = s[:old.start()] + replacement + s[old.end():]
          s = s.replace("function showProvider(i){const p=providers[i];openModal(p.name,`<p>${p.city}</p><div class=\"tags\">${p.tags.map(t=>`<span class=\"tag\">${t}</span>`).join('')}</div><p style=\"margin-top:14px\">Contact the provider directly to verify availability, pricing, credentials, and scheduling.</p>`)}`",
                        "function showProvider(i){const p=providers[i];openModal(p.name,`<p>${p.address1||''}${p.address2?' '+p.address2:''}<br>${p.city}, ${p.state} ${p.zip||''}</p>${p.phone?`<p><a href=\"tel:${p.phone}\">${p.phone}</a></p>`:''}<div class=\"tags\">${p.tags.map(t=>`<span class=\"tag\">${t}</span>`).join('')}</div><p style=\"margin-top:14px\">NPI: ${p.npi}. Public NPPES record; verify current service area, availability, pricing, credentials, and scheduling directly with the provider.</p>`)}`")
          s = s.replace("function renderProviderList(list){return `<div class=\"results\">${list.map(p=>`<div class=\"result\"><h3>${p.name}</h3><p>${p.city}</p><div class=\"tags\">${p.tags.map(t=>`<span class=\"tag\">${t}</span>`).join('')}</div></div>`).join('')}</div>`}",
                        "function renderProviderList(list){return `<div class=\"results\">${list.map(p=>`<div class=\"result\"><h3>${p.name}</h3><p>${p.city}, ${p.state} ${p.zip||''}${p.phone?`<br><a href=\"tel:${p.phone}\">${p.phone}</a>`:''}</p><div class=\"tags\">${p.tags.map(t=>`<span class=\"tag\">${t}</span>`).join('')}</div></div>`).join('')}</div>`}")
          s = s.replace("function showProviderCategory(tag){closeMobileNav();const list=tag==='All'?providers:providers.filter(p=>p.tags.includes(tag));openModal(tag==='All'?'All Providers':tag+' Providers',renderProviderList(list))}",
                        "function showProviderCategory(tag){closeMobileNav();const list=tag==='All'?providers:providers.filter(p=>p.tags.includes(tag));openModal(tag==='All'?`Illinois Providers (${list.length})`:tag+' Providers',renderProviderList(list.slice(0,250)))}")
          s = s.replace("function showStateOption(state){closeMobileNav();openModal(state==='All States'?'Browse by State':state+' Medical Transportation',`<p>${state==='All States'?'Select a state to browse independent medical transportation providers as directory coverage expands.':'Browse independent medical transportation providers serving '+state+'. Directory coverage is being expanded.'}</p>`)}`",
                        "function showStateOption(state){closeMobileNav();if(state==='Illinois'){openModal(`Illinois Medical Transportation (${providers.length})`,renderProviderList(providers.slice(0,250)));return}openModal(state==='All States'?'Browse by State':state+' Medical Transportation',`<p>${state==='All States'?'Select a state to browse independent medical transportation providers as directory coverage expands.':'Directory coverage for '+state+' is being expanded.'}</p>`)}`")
          s = s.replace("function renderResults(){return renderProviderList(providers)}\nfunction runMobileSearch(e){e.preventDefault();openModal('Matching Providers',renderResults())}\nfunction runSearch(){openModal('Matching Providers',renderResults())}",
                        "function getFilteredProviders(){const q=(document.getElementById('mLocation')?.value||document.getElementById('location')?.value||'').trim().toLowerCase();if(!q)return providers;return providers.filter(p=>[p.name,p.city,p.zip,p.address1].some(v=>(v||'').toLowerCase().includes(q)))}\nfunction renderResults(){return renderProviderList(getFilteredProviders().slice(0,250))}\nfunction runMobileSearch(e){e.preventDefault();const list=getFilteredProviders();openModal(`Matching Providers (${list.length})`,renderProviderList(list.slice(0,250)))}\nfunction runSearch(){const list=getFilteredProviders();openModal(`Matching Providers (${list.length})`,renderProviderList(list.slice(0,250)))}")
          s = s.replace("document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})", "document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});loadProviders()")
          p.write_text(s, encoding='utf-8')

      - name: Commit provider database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers-il.json index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import Illinois NEMT provider database"
          git push
