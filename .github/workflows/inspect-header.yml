name: Inspect clean header

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Export old clean header crop as base64 text
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import subprocess, base64, io

          raw = subprocess.check_output(['git','show','e704ed8e581f042ebbdbd15a785bac82037b62fc:directory-landing-approved.png'])
          im = Image.open(io.BytesIO(raw)).convert('RGB')
          w,h = im.size
          crop_h = min(180, h)
          crop = im.crop((0,0,w,crop_h))
          # Downscale only if very wide so the text file stays manageable.
          if crop.width > 1200:
              nh = round(crop.height * 1200 / crop.width)
              crop = crop.resize((1200,nh), Image.Resampling.LANCZOS)
          out = io.BytesIO()
          crop.save(out, format='JPEG', quality=88)
          Path('header-inspect.txt').write_text(f'ORIGINAL_SIZE={w}x{h}\nCROP_SIZE={crop.width}x{crop.height}\nDATA='+base64.b64encode(out.getvalue()).decode())
      - name: Commit inspection text
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add header-inspect.txt
          git diff --cached --quiet && exit 0
          git commit -m "Export clean header inspection crop"
          git push origin HEAD:${{ github.head_ref }}
