name: Inspect clean header

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Export tiny clean-header thumbnail
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import subprocess, base64, io

          raw = subprocess.check_output(['git','show','e704ed8e581f042ebbdbd15a785bac82037b62fc:directory-landing-approved.png'])
          im = Image.open(io.BytesIO(raw)).convert('RGB')
          w,h = im.size
          crop = im.crop((0,0,min(700,w),min(150,h)))
          nh = round(crop.height * 300 / crop.width)
          crop = crop.resize((300,nh), Image.Resampling.LANCZOS)
          out = io.BytesIO()
          crop.save(out, format='JPEG', quality=28, optimize=True)
          Path('header-inspect.txt').write_text(f'ORIGINAL_SIZE={w}x{h}\nCROP_SIZE={crop.width}x{crop.height}\nDATA='+base64.b64encode(out.getvalue()).decode())
      - name: Commit inspection text
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add header-inspect.txt
          git diff --cached --quiet && exit 0
          git commit -m "Export tiny clean header inspection crop"
          git push origin HEAD:${{ github.head_ref }}
