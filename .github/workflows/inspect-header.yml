name: Inspect clean header

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Export tiny logo source
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          import subprocess, base64, io, re

          wf = subprocess.check_output(['git','show','19f245d2c93dc8ecfe440f02f171a39f31261c36:.github/workflows/bake-header-logo.yml'], text=True)
          m = re.search(r"payload = '''([^']+)'''", wf, re.S)
          logo = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          thumb = logo.resize((130,52), Image.Resampling.LANCZOS)
          out = io.BytesIO(); thumb.save(out, format='JPEG', quality=22, optimize=True)
          Path('header-inspect.txt').write_text(
              f'LOGO_SIZE={logo.width}x{logo.height}\nTHUMB_SIZE={thumb.width}x{thumb.height}\nDATA='+base64.b64encode(out.getvalue()).decode()
          )
      - name: Commit inspection text
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add header-inspect.txt
          git diff --cached --quiet && exit 0
          git commit -m "Export tiny logo source thumbnail"
          git push origin HEAD:${{ github.head_ref }}
