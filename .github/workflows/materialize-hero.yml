name: Materialize approved hero image

on:
  push:
    branches:
      - main
    paths:
      - 'assets/hero-parts/**'
      - '.github/workflows/materialize-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode approved hero image
        shell: bash
        run: |
          mkdir -p assets
          cat assets/hero-parts/part1.txt assets/hero-parts/part2.txt \
            | tr -d '\r\n\t ' \
            | base64 --decode > assets/approved-landing.jpg
          test -s assets/approved-landing.jpg
          file assets/approved-landing.jpg

      - name: Commit static image
        shell: bash
        run: |
          if git diff --quiet -- assets/approved-landing.jpg && git ls-files --error-unmatch assets/approved-landing.jpg >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved-landing.jpg
          git commit -m "Materialize approved landing image"
          git push
