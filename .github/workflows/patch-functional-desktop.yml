name: Patch functional desktop branch

on:
  push:
    branches: [main]
    paths:
      - '.functional-desktop-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: functional-desktop-html
      - name: Patch desktop interaction layer
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_css = ".hotspot,.live-field{position:absolute;z-index:5}.hotspot{border:0;background:transparent;color:transparent}.live-field{border:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;outline:0}\n#location{left:8.75%;top:28.95%;width:13.15%;height:3.85%}#service{left:23%;top:28.95%;width:14.6%;height:3.85%}#accessibility{left:38.6%;top:28.95%;width:13.35%;height:3.85%}"
          new_css = ".hotspot,.live-field{position:absolute;z-index:5}.hotspot{border:0;background:transparent;color:transparent;padding:0;margin:0;cursor:pointer;touch-action:manipulation}.hotspot:focus-visible{outline:2px solid #087f96;outline-offset:2px}.live-field{border:0;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;font:500 clamp(8px,.78vw,13px)/1 Arial,Helvetica,sans-serif;padding:0 .7%;appearance:none;border-radius:5px}.live-field:focus,.live-field.has-value{background:#fff;color:#31536b;-webkit-text-fill-color:#31536b}.live-field:-webkit-autofill,.live-field:-webkit-autofill:hover,.live-field:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #fff inset!important;-webkit-text-fill-color:#31536b!important}\n#location{left:8.75%;top:28.95%;width:13.15%;height:3.85%}#service{left:23%;top:28.95%;width:14.6%;height:3.85%}#accessibility{left:38.6%;top:28.95%;width:13.35%;height:3.85%}"
          if old_css not in s:
              raise RuntimeError('Desktop CSS target not found')
          s = s.replace(old_css, new_css, 1)

          old_desktop = '''<main class="desktop">
  <img src="directory-landing-approved.png" alt="Independent Medical Transportation Directory">
  <input id="location" class="live-field" aria-label="Location">
  <select id="service" class="live-field" aria-label="Service type"><option value=""></option><option>Ambulatory</option><option>Wheelchair</option><option>Dialysis</option><option>Doctor Visit</option><option>Stretcher</option><option>Companion</option></select>
  <select id="accessibility" class="live-field" aria-label="Accessibility needs"><option value=""></option><option>Wheelchair</option><option>Stretcher</option><option>Ambulatory</option></select>
  <button class="hotspot" aria-label="Find Providers" style="left:52.9%;top:28.85%;width:8.8%;height:4.35%" onclick="runSearch()"></button>
</main>'''
          new_desktop = '''<main class="desktop" id="desktopDirectory">
  <img src="directory-landing-approved.png" alt="Independent Medical Transportation Directory">
  <button type="button" class="hotspot" aria-label="Eazy Medical Transportation home" style="left:4.5%;top:4.25%;width:18%;height:4.2%" onclick="scrollRatio(0)"></button>
  <button type="button" class="hotspot" aria-label="Home" style="left:44.55%;top:4.25%;width:4.8%;height:4.2%" onclick="scrollRatio(0)"></button>
  <button type="button" class="hotspot" aria-label="Browse Providers" style="left:50.75%;top:4.25%;width:9.2%;height:4.2%" onclick="scrollRatio(.37)"></button>
  <button type="button" class="hotspot" aria-label="Browse by State" style="left:61.0%;top:4.25%;width:6.6%;height:4.2%" onclick="showStateOption('All States')"></button>
  <button type="button" class="hotspot" aria-label="Wheelchair Vans" style="left:69.5%;top:4.25%;width:9.2%;height:4.2%" onclick="showWheelchairOption('Wheelchair transportation')"></button>
  <button type="button" class="hotspot" aria-label="About" style="left:79.4%;top:4.25%;width:5.0%;height:4.2%" onclick="scrollRatio(.835)"></button>
  <a class="hotspot" aria-label="Contact" style="left:85.4%;top:4.25%;width:5.2%;height:4.2%" href="mailto:info@eazymedicaltransportation.com"></a>
  <input id="location" class="live-field" name="directory-location" aria-label="Location" placeholder="City, State or ZIP Code" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" oninput="fieldState(this)">
  <select id="service" class="live-field" aria-label="Service type" onchange="fieldState(this)"><option value=""></option><option>Ambulatory</option><option>Wheelchair</option><option>Dialysis</option><option>Doctor Visit</option><option>Stretcher</option><option>Companion</option></select>
  <select id="accessibility" class="live-field" aria-label="Accessibility needs" onchange="fieldState(this)"><option value=""></option><option>Wheelchair</option><option>Stretcher</option><option>Ambulatory</option></select>
  <button type="button" class="hotspot" aria-label="Find Providers" style="left:52.9%;top:28.85%;width:8.8%;height:4.35%" onclick="runSearch()"></button>
  <button type="button" class="hotspot" aria-label="Browse all providers" style="left:85.9%;top:40.45%;width:9.4%;height:2.8%" onclick="showProviderCategory('All')"></button>
  <button type="button" class="hotspot" aria-label="View North Shore Medical Transport" style="left:6.3%;top:59.35%;width:10.3%;height:2.8%" onclick="showDesktopProvider(0)"></button>
  <button type="button" class="hotspot" aria-label="View Chicago Senior Ride Services" style="left:20.2%;top:59.35%;width:10.5%;height:2.8%" onclick="showDesktopProvider(1)"></button>
  <button type="button" class="hotspot" aria-label="View Lake County Wheelchair Transit" style="left:34.6%;top:59.35%;width:10.4%;height:2.8%" onclick="showDesktopProvider(2)"></button>
  <button type="button" class="hotspot" aria-label="View Suburban Patient Transport" style="left:48.7%;top:59.35%;width:10.5%;height:2.8%" onclick="showDesktopProvider(3)"></button>
  <button type="button" class="hotspot" aria-label="View Metro Dialysis Rides" style="left:62.1%;top:59.35%;width:10.5%;height:2.8%" onclick="showDesktopProvider(4)"></button>
  <button type="button" class="hotspot" aria-label="View Heartland Medical Transit" style="left:76.1%;top:59.35%;width:10.5%;height:2.8%" onclick="showDesktopProvider(5)"></button>
  <button type="button" class="hotspot" aria-label="Footer Home" style="left:24.6%;top:85.5%;width:6.8%;height:2.2%" onclick="scrollRatio(0)"></button>
  <button type="button" class="hotspot" aria-label="Footer Browse Providers" style="left:24.6%;top:87.8%;width:9.0%;height:2.2%" onclick="scrollRatio(.37)"></button>
  <button type="button" class="hotspot" aria-label="Footer By State" style="left:24.6%;top:90.0%;width:6.6%;height:2.2%" onclick="showStateOption('All States')"></button>
  <button type="button" class="hotspot" aria-label="Footer Wheelchair Vans" style="left:24.6%;top:92.2%;width:9.0%;height:2.2%" onclick="showWheelchairOption('Wheelchair transportation')"></button>
  <button type="button" class="hotspot" aria-label="What is NEMT" style="left:38.1%;top:85.5%;width:8.8%;height:2.2%" onclick="showInfo('What is NEMT?','Non-emergency medical transportation (NEMT) helps people travel to medical appointments when emergency transport is not required.')"></button>
  <button type="button" class="hotspot" aria-label="Types of Services" style="left:38.1%;top:87.8%;width:9.2%;height:2.2%" onclick="showInfo('Types of Services','Directory listings may include ambulatory, wheelchair, stretcher, dialysis and companion transportation services.')"></button>
  <button type="button" class="hotspot" aria-label="Tips for Choosing a Provider" style="left:38.1%;top:90.0%;width:12.0%;height:2.2%" onclick="showInfo('Tips for Choosing a Provider','Verify availability, service area, vehicle type, credentials, insurance acceptance and pricing directly with each provider.')"></button>
  <button type="button" class="hotspot" aria-label="Frequently Asked Questions" style="left:38.1%;top:92.2%;width:12.5%;height:2.2%" onclick="showInfo('Frequently Asked Questions','Use the search controls above to narrow providers by location, service type and accessibility needs. Always verify provider information independently.')"></button>
  <button type="button" class="hotspot" aria-label="Terms of Use" style="left:54.5%;top:85.5%;width:7.0%;height:2.2%" onclick="showInfo('Terms of Use','This site is an independent informational directory. Provider information should be independently verified before arranging transportation.')"></button>
  <button type="button" class="hotspot" aria-label="Privacy Policy" style="left:54.5%;top:87.8%;width:7.0%;height:2.2%" onclick="showInfo('Privacy Policy','Search entries are used to provide directory functionality. Do not submit sensitive medical information through the directory search fields.')"></button>
  <button type="button" class="hotspot" aria-label="Disclaimer" style="left:54.5%;top:90.0%;width:6.5%;height:2.2%" onclick="showInfo('Disclaimer','EazyMedicalTransportation.com is an independent directory and is not affiliated with Eazy Medical Transportation LLC or any listed provider.')"></button>
  <a class="hotspot" aria-label="Email Eazy Medical Transportation Directory" style="left:72.8%;top:87.6%;width:18%;height:2.3%" href="mailto:info@eazymedicaltransportation.com"></a>
  <button type="button" class="hotspot" aria-label="EazyMedicalTransportation.com home" style="left:72.8%;top:90.3%;width:18%;height:2.3%" onclick="scrollRatio(0)"></button>
</main>'''
          if old_desktop not in s:
              raise RuntimeError('Desktop markup target not found')
          s = s.replace(old_desktop, new_desktop, 1)

          anchor = "function closeModal(){document.getElementById('modal').classList.remove('open')}\n"
          helpers = '''function fieldState(el){el.classList.toggle('has-value',!!el.value)}
function scrollRatio(r){const s=document.getElementById('desktopDirectory');if(!s)return;window.scrollTo({top:s.offsetTop+s.offsetHeight*r,behavior:'smooth'})}
function showInfo(title,text){openModal(title,`<div class="claim-callout">${escapeHtml(text)}</div>`)}
const desktopFeatured=[
{name:'North Shore Medical Transport',city:'Evanston, IL',services:['Wheelchair','Ambulatory']},
{name:'Chicago Senior Ride Services',city:'Chicago, IL',services:['Ambulatory','Companion']},
{name:'Lake County Wheelchair Transit',city:'Waukegan, IL',services:['Wheelchair','Stretcher']},
{name:'Suburban Patient Transport',city:'Schaumburg, IL',services:['Ambulatory','Wheelchair']},
{name:'Metro Dialysis Rides',city:'Naperville, IL',services:['Dialysis','Wheelchair']},
{name:'Heartland Medical Transit',city:'Aurora, IL',services:['Ambulatory','Stretcher']}
];
function showDesktopProvider(i){const p=desktopFeatured[i];if(!p)return;openModal(p.name,`<div class="provider-meta">${escapeHtml(p.city)}</div><div class="tags" style="margin-top:10px">${p.services.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div><p class="ride-note" style="margin-top:14px">Provider information should be verified independently before arranging transportation.</p>`)}
'''
          if anchor not in s:
              raise RuntimeError('JavaScript insertion target not found')
          s = s.replace(anchor, anchor + helpers, 1)
          p.write_text(s)
      - name: Commit to functional branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make desktop landing page functional without visual changes"
          git push origin functional-desktop-html
