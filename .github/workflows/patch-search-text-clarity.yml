name: Patch search text clarity

on:
  push:
    branches: [main]
    paths:
      - '.search-text-clarity-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-search-text-clarity
          fetch-depth: 0
      - name: Add crisp native search helper text
        shell: python
        run: |
          from pathlib import Path
          p=Path('menu-fix.js')
          s=p.read_text()
          marker="  const actions={'Eazy Medical Transportation home':()=>scrollRatio(0)"
          if marker not in s:
              raise SystemExit('actions marker not found')
          fn=r'''
  function installCrispSearchText(){
    const root=document.getElementById('desktopDirectory');
    if(!root||root.querySelector('.crisp-directory-note'))return;
    const style=document.createElement('style');
    style.textContent=`
      #location{background:#fff!important;color:#4d6474!important;-webkit-text-fill-color:#4d6474!important;font-weight:500!important;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      #location::placeholder{color:#4d6474!important;opacity:1!important}
      #service,#accessibility{color:#4d6474!important;-webkit-text-fill-color:#4d6474!important;font-weight:500!important;background:linear-gradient(90deg,#fff 0%,#fff 84%,rgba(255,255,255,0) 84%,rgba(255,255,255,0) 100%)!important;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      .crisp-directory-note{position:absolute;left:34.6%;top:34.35%;width:42.2%;height:2.15%;z-index:6;display:flex;align-items:center;background:#fff;color:#40596b;font:600 clamp(8px,.72vw,13px)/1 Arial,Helvetica,sans-serif;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      @media(max-width:760px){.crisp-directory-note{display:none}}
    `;
    document.head.appendChild(style);
    const service=document.getElementById('service');
    const access=document.getElementById('accessibility');
    if(service&&service.options.length)service.options[0].textContent='e.g., Dialysis, Doctor Visit';
    if(access&&access.options.length)access.options[0].textContent='e.g., Wheelchair, Stretcher';
    const note=document.createElement('div');
    note.className='crisp-directory-note';
    note.textContent='This directory lists independent providers. We do not provide transportation services.';
    root.appendChild(note);
  }

'''
          s=s.replace(marker,fn+marker,1)
          call='  installCrispProviderCards();\n})();'
          if call not in s:
              raise SystemExit('install call marker not found')
          s=s.replace(call,'  installCrispSearchText();\n  installCrispProviderCards();\n})();',1)
          p.write_text(s)
      - name: Validate search text patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('menu-fix.js').read_text()
          assert 'installCrispSearchText' in s
          assert 'e.g., Dialysis, Doctor Visit' in s
          assert 'crisp-directory-note' in s
          assert '#4d6474' in s
          print('search text clarity patch installed')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add menu-fix.js
          git diff --cached --quiet && exit 0
          git commit -m "Render search helper text crisply"
          git push origin fix-search-text-clarity
