name: Publish Corrected Ride2Dialysis Page

on:
  push:
    paths:
      - .r2d-publish-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble corrected page
        run: |
          cat ride2dialysis/.index-new.00 ride2dialysis/.index-new.01 ride2dialysis/.index-new.02 > /tmp/ride2dialysis-index.html
      - name: Publish corrected live page through the GitHub contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 /tmp/ride2dialysis-index.html)
          URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/ride2dialysis/index.html"
          for attempt in 1 2 3 4 5; do
            SHA=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${URL}?ref=main" | jq -r '.sha')
            jq -n \
              --arg message "Rebuild and correct the Ride2Dialysis live page" \
              --arg content "${CONTENT}" \
              --arg sha "${SHA}" \
              --arg branch "main" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/payload.json
            code=$(curl -sS -o /tmp/result.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${URL}" \
              --data-binary @/tmp/payload.json)
            if [ "${code}" = "200" ] || [ "${code}" = "201" ]; then
              cat /tmp/result.json
              exit 0
            fi
            cat /tmp/result.json
            sleep $((attempt * 2))
          done
          echo "Unable to publish corrected page after retries" >&2
          exit 1
