name: Repair Ride2Dialysis Hero

on:
  push:
    paths:
      - .r2d-hero-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Build clean hero photo and remove visual artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps

          root = Path('ride2dialysis')
          source = root / 'provider-4.webp'
          if not source.exists():
              source = root / 'provider-1.webp'
          im = Image.open(source).convert('RGB')
          print('source', source, im.size)

          # Create a dedicated hero photo from a clean provider photograph rather
          # than magnifying the old full-page artwork.  This removes all baked-in
          # words, search boxes and duplicate text from the photograph.
          hero = ImageOps.fit(
              im,
              (1600, 1120),
              method=Image.Resampling.LANCZOS,
              centering=(0.55, 0.50),
          )
          hero = ImageEnhance.Contrast(hero).enhance(1.045)
          hero = ImageEnhance.Color(hero).enhance(1.025)
          hero = hero.filter(ImageFilter.UnsharpMask(radius=1.1, percent=125, threshold=3))
          hero.save(root / 'hero-photo.webp', 'WEBP', quality=92, method=6)

          page = root / 'index.html'
          text = page.read_text(encoding='utf-8')
          text = text.replace('hero-photo.webp?v=1', 'hero-photo.webp?v=3')
          text = text.replace('hero-photo.webp?v=2', 'hero-photo.webp?v=3')
          text = text.replace('object-position:center center;display:block', 'object-position:55% center;display:block')
          # The approved search-card benefit uses a check, not the unrelated
          # person/tool-looking glyph that was appearing in the second item.
          marker = '<b>Specialized for Dialysis</b>'
          pos = text.find(marker)
          if pos != -1:
              start = text.rfind('<use href="#i-user"/>', 0, pos)
              if start != -1:
                  text = text[:start] + '<use href="#i-check"/>' + text[start + len('<use href="#i-user"/>'):]
          page.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride2dialysis/hero-photo.webp ride2dialysis/index.html
          git diff --cached --quiet || git commit -m "Replace blurry Ride2Dialysis hero with a clean photo"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
