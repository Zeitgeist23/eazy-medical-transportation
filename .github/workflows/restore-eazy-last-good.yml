name: Restore Eazy last good

on:
  push:
    branches: [main]
    paths:
      - '.restore-eazy-trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore Eazy site files from last visually acceptable commit
        run: |
          git checkout 9a50aa4f7ad5c5aa320b62bad69a23823f7feaf0 -- index.html menu-fix.js directory-landing-approved.png
          git rm -f --ignore-unmatch safe-ui-fixes.js visual-fixes.js
      - name: Validate restored files
        run: |
          test "$(git rev-parse 9a50aa4f7ad5c5aa320b62bad69a23823f7feaf0:index.html)" = "$(git hash-object index.html)"
          test "$(git rev-parse 9a50aa4f7ad5c5aa320b62bad69a23823f7feaf0:menu-fix.js)" = "$(git hash-object menu-fix.js)"
          test "$(git rev-parse 9a50aa4f7ad5c5aa320b62bad69a23823f7feaf0:directory-landing-approved.png)" = "$(git hash-object directory-landing-approved.png)"
          test ! -e safe-ui-fixes.js
          test ! -e visual-fixes.js
      - name: Commit exact Eazy restoration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html menu-fix.js directory-landing-approved.png
          git add -u safe-ui-fixes.js visual-fixes.js || true
          git diff --cached --quiet && exit 0
          git commit -m "Restore last visually acceptable Eazy version"
          git push origin main
