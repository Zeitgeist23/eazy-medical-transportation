name: Restore Featured visuals and modal close

on:
  push:
    branches: [main]
    paths:
      - '.restore-featured-visuals-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore approved Featured provider interaction layer
        run: |
          git checkout 5e17f5b85756b441e0695e95053437807b37ef51 -- provider-cards-live.js
      - name: Add independent modal close controls
        shell: python
        run: |
          from pathlib import Path
          p=Path('provider-cards-live.js')
          s=p.read_text()
          marker='/* independent-modal-close-fix */'
          if marker not in s:
              s += r'''

/* independent-modal-close-fix */
(()=>{
  'use strict';
  function forceCloseProviderModal(){
    const modal=document.getElementById('modal');
    if(!modal) return;
    modal.classList.remove('open','provider-popup-large');
  }
  document.addEventListener('click',e=>{
    const close=e.target.closest?.('.close,[aria-label="Close"]');
    if(close){
      e.preventDefault();
      e.stopImmediatePropagation();
      forceCloseProviderModal();
      return;
    }
    if(e.target?.id==='modal'){
      e.preventDefault();
      e.stopImmediatePropagation();
      forceCloseProviderModal();
    }
  },true);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') forceCloseProviderModal();
  },true);
})();
'''
          p.write_text(s)
      - name: Validate repair
        run: |
          grep -q 'live-provider-tab' provider-cards-live.js
          grep -q 'independent-modal-close-fix' provider-cards-live.js
          if grep -q 'live-provider-card' provider-cards-live.js; then echo 'Visible replacement cards still present' && exit 1; fi
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provider-cards-live.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore approved Featured provider visuals and fix modal close"
          git push origin main
