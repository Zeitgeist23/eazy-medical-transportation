name: Roll back bad visual overlay

on:
  push:
    branches: [main]
    paths:
      - '.rollback-overlay-trigger'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rollback-bad-visual-overlay
      - name: Remove consolidated visual overlay
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('\n<script src="visual-fixes.js?v=8"></script>','')
          p.write_text(s)
      - name: Validate rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'visual-fixes.js?v=8' not in s
          print('bad visual overlay removed')
          PY
      - name: Commit rollback branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove broken visual overlay"
          git push origin rollback-bad-visual-overlay
