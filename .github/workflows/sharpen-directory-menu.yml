name: Sharpen directory menu text

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sharpen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Sharpen only existing menu controls
        shell: python
        run: |
          from PIL import Image, ImageFilter, ImageChops
          from pathlib import Path
          src = Path('directory-landing-approved.png')
          im = Image.open(src).convert('RGB')
          out = im.copy()
          rects = [
              (118,292,305,334),
              (327,292,529,334),
              (536,292,732,334),
              (743,292,863,334),
          ]
          for box in rects:
              crop = im.crop(box)
              sharp = crop.filter(ImageFilter.UnsharpMask(radius=1.15, percent=190, threshold=2))
              out.paste(sharp, box)
          # Verify that every changed pixel is inside the intended menu-control band.
          diff = ImageChops.difference(im, out)
          bbox = diff.getbbox()
          print('Changed pixel bounding box:', bbox)
          if bbox is None:
              raise SystemExit('No sharpening change detected')
          allowed = (118,292,863,334)
          if not (bbox[0] >= allowed[0] and bbox[1] >= allowed[1] and bbox[2] <= allowed[2] and bbox[3] <= allowed[3]):
              raise SystemExit(f'Unexpected changes outside menu controls: {bbox}')
          out.save(src, optimize=True)
      - name: Commit sharpened image only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory-landing-approved.png
          git diff --cached --quiet && exit 0
          git commit -m "Sharpen text in directory menu controls"
          git push origin HEAD:${{ github.head_ref }}
