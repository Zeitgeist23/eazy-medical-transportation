name: Sharpen featured text

on:
  push:
    branches:
      - fix/sharpen-featured-how-text-20260807

permissions:
  contents: write

jobs:
  sharpen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Sharpen specified text regions
        shell: python
        run: |
          from PIL import Image, ImageFilter, ImageChops, ImageDraw
          from pathlib import Path
          src = Path('directory-landing-approved.png')
          im = Image.open(src).convert('RGB')
          out = im.copy()
          rects = [
              (342,350,850,380),(105,385,420,432),(1200,390,1420,430),
              (69,500,248,575),(69,580,248,606),(89,612,228,640),
              (267,500,449,575),(267,580,449,606),(287,612,429,640),
              (468,500,646,575),(468,580,646,606),(488,612,626,640),
              (665,500,840,575),(665,580,840,606),(685,612,820,640),
              (856,500,1033,575),(856,580,1033,606),(876,612,1013,640),
              (1053,500,1251,575),(1053,580,1251,606),(1073,612,1231,640),
              (475,655,760,692),(79,686,215,780),(415,686,555,780),(741,686,875,780),
          ]
          for box in rects:
              crop = im.crop(box)
              out.paste(crop.filter(ImageFilter.UnsharpMask(radius=1.15, percent=190, threshold=2)), box)
          diff = ImageChops.difference(im, out).convert('L')
          allowed = Image.new('L', im.size, 0)
          draw = ImageDraw.Draw(allowed)
          for box in rects:
              draw.rectangle(box, fill=255)
          outside = ImageChops.multiply(diff, ImageChops.invert(allowed))
          if outside.getbbox() is not None:
              raise SystemExit('Unexpected pixel changes outside approved text regions')
          if diff.getbbox() is None:
              raise SystemExit('No sharpening change detected')
          out.save(src, optimize=True)
      - name: Commit sharpened PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory-landing-approved.png
          git diff --cached --quiet && exit 0
          git commit -m "Sharpen featured providers and directory-workflow text"
          git push
