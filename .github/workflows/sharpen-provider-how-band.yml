name: Sharpen provider and how band

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sharpen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Sharpen only Featured Providers and How the Directory Works band
        shell: python
        run: |
          from PIL import Image, ImageFilter, ImageChops
          from pathlib import Path
          src = Path('directory-landing-approved.png')
          im = Image.open(src).convert('RGB')
          out = im.copy()

          # Exact band containing the disclaimer line, Featured Providers cards,
          # and How the Directory Works panel on the 1448x1086 approved asset.
          box = (42, 350, 1388, 805)
          crop = im.crop(box)
          sharp = crop.filter(ImageFilter.UnsharpMask(radius=1.05, percent=175, threshold=2))
          out.paste(sharp, box)

          # Confirm nothing outside the intended band changed.
          diff = ImageChops.difference(im, out)
          bbox = diff.getbbox()
          print('Changed pixel bounding box:', bbox)
          if bbox is None:
              raise SystemExit('No sharpening change detected')
          if not (bbox[0] >= box[0] and bbox[1] >= box[1] and bbox[2] <= box[2] and bbox[3] <= box[3]):
              raise SystemExit(f'Unexpected changes outside approved band: {bbox}')

          out.save(src, optimize=True)
      - name: Commit sharpened PNG only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory-landing-approved.png
          git diff --cached --quiet && exit 0
          git commit -m "Sharpen Featured Providers and directory instructions"
          git push origin HEAD:${{ github.head_ref }}
