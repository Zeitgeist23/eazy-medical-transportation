name: Sharpen Ride2Dialysis Hero Only

on:
  push:
    paths:
      - .r2d-sharpen-trigger

permissions:
  contents: write

jobs:
  sharpen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Upscale and clean existing hero image only
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          p=Path('ride2dialysis/hero-photo.webp')
          im=Image.open(p).convert('RGB')
          w,h=im.size
          print('original',w,h)
          # Double the source resolution so the browser no longer has to enlarge a small raster.
          im=im.resize((w*2,h*2),Image.Resampling.LANCZOS)
          # Reduce blockiness/grain without altering composition, then restore edge clarity.
          im=im.filter(ImageFilter.MedianFilter(size=3))
          im=ImageEnhance.Contrast(im).enhance(1.02)
          im=ImageEnhance.Sharpness(im).enhance(1.22)
          im=im.filter(ImageFilter.UnsharpMask(radius=1.0,percent=125,threshold=3))
          im.save(p,'WEBP',quality=96,method=6)
          print('new',im.size)
          PY
      - name: Commit image-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride2dialysis/hero-photo.webp
          git diff --cached --quiet || git commit -m "Sharpen Ride2Dialysis hero image without layout changes"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
