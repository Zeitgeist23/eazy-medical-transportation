name: Sharpen Ride2Dialysis Artwork

on:
  push:
    paths:
      - '.github/workflows/sharpen-ride2dialysis.yml'

permissions:
  contents: write

jobs:
  sharpen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Rebuild and sharpen approved artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          import base64, io, math

          root = Path('ride2dialysis')
          parts = [root / f'approved-image.{i:02d}' for i in range(9)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          raw = base64.b64decode(encoded)
          img = Image.open(io.BytesIO(raw)).convert('RGB')

          scale = 2.5
          img = img.resize((round(img.width*scale), round(img.height*scale)), Image.Resampling.LANCZOS)
          img = ImageEnhance.Contrast(img).enhance(1.035)
          img = img.filter(ImageFilter.UnsharpMask(radius=1.25, percent=165, threshold=2))
          img = ImageEnhance.Sharpness(img).enhance(1.12)

          out = io.BytesIO()
          img.save(out, 'WEBP', quality=94, method=6)
          new_encoded = base64.b64encode(out.getvalue()).decode('ascii')
          chunk = math.ceil(len(new_encoded)/9)
          for i, p in enumerate(parts):
              p.write_text(new_encoded[i*chunk:(i+1)*chunk])
          PY
      - name: Commit sharpened artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride2dialysis/approved-image.0*
          if git diff --cached --quiet; then
            echo "No artwork changes"
          else
            git commit -m "Sharpen Ride2Dialysis full-page artwork"
            git push
          fi
