name: Apply targeted UI fixes

on:
  push:
    branches: [main]
    paths:
      - '.targeted-ui-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: targeted-ui-fixes
      - name: Patch provider cards and search helper UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('menu-fix.js')
          s=p.read_text()

          new_provider=r'''  function installCrispProviderCards(){
    const root=document.getElementById('desktopDirectory');
    if(!root||root.querySelector('.crisp-provider-layer'))return;
    const cleanImage='https://raw.githubusercontent.com/Zeitgeist23/eazy-medical-transportation/9a50aa4f7ad5c5aa320b62bad69a23823f7feaf0/directory-landing-approved.png';
    const img=root.querySelector(':scope > img');
    if(img)img.src=cleanImage;
    const style=document.createElement('style');
    style.textContent=`
      .crisp-provider-layer{position:absolute;inset:0;z-index:6;pointer-events:none;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      .crisp-provider-layer .cp-name,.crisp-provider-layer .cp-city,.crisp-provider-layer .cp-tags,.crisp-provider-layer .cp-view{position:absolute;box-sizing:border-box;text-align:center;z-index:1}
      .crisp-provider-layer .cp-name{top:49.35%;width:12.15%;min-height:3.25%;display:flex;align-items:center;justify-content:center;background:#fff;color:#111827;font-weight:700;font-size:clamp(9px,.72vw,14px);line-height:1.08;padding:0 .22%}
      .crisp-provider-layer .cp-city{top:53.18%;width:12.15%;height:1.72%;display:flex;align-items:center;justify-content:center;background:#fff;color:#174b83;font-weight:600;font-size:clamp(8px,.60vw,12px);line-height:1;gap:4px}
      .crisp-provider-layer .cp-pin{width:10px;height:12px;flex:0 0 auto;color:#174b83}
      .crisp-provider-layer .cp-tags{top:55.48%;width:12.15%;height:2.18%;display:flex;align-items:center;justify-content:center;gap:.55%;background:#fff}
      .crisp-provider-layer .cp-tags span{display:inline-flex;align-items:center;justify-content:center;height:1.52vw;max-height:23px;min-height:15px;padding:0 .52vw;border:1px solid #b7dfe7;border-radius:999px;background:#eaf7f9;color:#174b83;font-weight:700;font-size:clamp(7px,.56vw,11px);line-height:1;white-space:nowrap}
      .crisp-provider-layer .cp-btnmask{position:absolute;top:58.9%;height:3.75%;background:#fff;z-index:0}
      .crisp-provider-layer .cp-view{top:59.35%;height:2.8%;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #13889a;border-radius:4px;color:#0b5269;font-weight:700;font-size:clamp(8px,.66vw,13px);line-height:1;pointer-events:auto;cursor:pointer}
      @media(max-width:760px){.crisp-provider-layer{display:none}.hero-art{background-image:url('${cleanImage}')!important}}
    `;
    document.head.appendChild(style);
    const layer=document.createElement('div');
    layer.className='crisp-provider-layer';
    const lefts=['5.35%','19.35%','33.72%','47.82%','61.22%','75.22%'];
    const buttonLefts=['6.3%','20.2%','34.6%','48.7%','62.1%','76.1%'];
    const buttonWidths=['10.3%','10.5%','10.4%','10.5%','10.5%','10.5%'];
    const pin=`<svg class="cp-pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6.5-5.75 6.5-11.2A6.5 6.5 0 0 0 5.5 9.8C5.5 15.25 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.7" r="2.2" fill="currentColor"/></svg>`;
    function tagsFor(p,data){
      const out=[],npi=String(p.npi||''),cats=data?.categories||{};
      for(const name of ['Wheelchair','Ambulatory','Dialysis','Doctor Visit','Stretcher','Companion']){
        if((cats[name]||[]).map(String).includes(npi))out.push(name);
        if(out.length===2)break;
      }
      if(!out.length){for(const t of (p.categories||p.tags||[])){const v=String(t);if(v&&v.toLowerCase()!=='all'&&!out.includes(v))out.push(v);if(out.length===2)break}}
      return out.length?out:['NEMT'];
    }
    function render(cards){
      layer.innerHTML=cards.map((c,i)=>`<div class="cp-name" style="left:${lefts[i]}">${esc(c.name||'Provider')}</div><div class="cp-city" style="left:${lefts[i]}">${pin}<span>${esc(c.city||'')}${c.state?`, ${esc(c.state)}`:''}</span></div><div class="cp-tags" style="left:${lefts[i]}">${(c._tags||['NEMT']).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="cp-btnmask" style="left:calc(${buttonLefts[i]} - .3%);width:calc(${buttonWidths[i]} + .6%)"></div><button type="button" class="cp-view" data-i="${i}" style="left:${buttonLefts[i]};width:${buttonWidths[i]}">View Provider</button>`).join('');
      layer.querySelectorAll('.cp-view').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();const c=cards[Number(btn.dataset.i)];openModal(c?.name||'Provider',providerList(c?[c]:[]))}));
    }
    async function load(abbr){
      try{const data=await getStateData(abbr);const cards=[...(data.providers||[])].sort((a,b)=>Number(Boolean(b.phone))-Number(Boolean(a.phone))||String(a.name||'').localeCompare(String(b.name||''))).slice(0,6).map(p=>Object.assign({},p,{_tags:tagsFor(p,data),categories:tagsFor(p,data)}));if(cards.length)render(cards)}catch(_){ }
    }
    root.appendChild(layer);
    let shown=window.__eazyMenuState||'IL';
    load(shown);
    setInterval(()=>{const next=window.__eazyMenuState||shown;if(next!==shown){shown=next;load(next)}},500);
  }'''

          pat=r"  function installCrispProviderCards\(\)\{.*?\n  \}\n\n  function installCrispSearchText\(\)\{"
          if not re.search(pat,s,re.S): raise SystemExit('provider function marker not found')
          s=re.sub(pat,new_provider+'\n\n  function installCrispSearchText(){',s,count=1,flags=re.S)

          new_search=r'''  function installCrispSearchText(){
    const root=document.getElementById('desktopDirectory');
    if(!root||root.querySelector('.crisp-directory-note'))return;
    const style=document.createElement('style');
    style.textContent=`
      #location{box-sizing:border-box!important;background:linear-gradient(90deg,transparent 0 44px,#fff 44px 100%)!important;color:#4d6474!important;-webkit-text-fill-color:#4d6474!important;font-weight:500!important;font-size:clamp(9px,.78vw,14px)!important;padding-left:44px!important;padding-right:12px!important;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      #location::placeholder{color:#4d6474!important;opacity:1!important}
      #service,#accessibility{box-sizing:border-box!important;color:#4d6474!important;-webkit-text-fill-color:#4d6474!important;font-weight:500!important;font-size:clamp(9px,.76vw,14px)!important;background:linear-gradient(90deg,transparent 0 44px,#fff 44px calc(100% - 34px),transparent calc(100% - 34px) 100%)!important;padding-left:44px!important;padding-right:34px!important;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      .crisp-directory-note{position:absolute;left:26.8%;top:34.2%;width:36.5%;height:2.1%;z-index:6;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;color:#40596b;font:600 clamp(8px,.70vw,13px)/1 Arial,Helvetica,sans-serif;white-space:nowrap;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      @media(max-width:760px){.crisp-directory-note{display:none}}
    `;
    document.head.appendChild(style);
    const service=document.getElementById('service'),access=document.getElementById('accessibility');
    if(service&&service.options.length)service.options[0].textContent='e.g., Dialysis, Doctor Visit';
    if(access&&access.options.length)access.options[0].textContent='e.g., Wheelchair, Stretcher';
    const note=document.createElement('div');
    note.className='crisp-directory-note';
    note.textContent='This directory lists independent providers. We do not provide transportation services.';
    root.appendChild(note);
  }'''
          pat2=r"  function installCrispSearchText\(\)\{.*?\n  \}\n\n  const actions="
          if not re.search(pat2,s,re.S): raise SystemExit('search function marker not found')
          s=re.sub(pat2,new_search+'\n\n  const actions=',s,count=1,flags=re.S)
          p.write_text(s)
      - name: Validate targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('menu-fix.js').read_text()
          assert 'cp-mask' not in s
          assert 'cp-btnmask' in s
          assert 'cp-pin' in s
          assert 'transparent 0 44px' in s
          assert 'width:36.5%' in s
          assert 'setInterval' in s
          print('targeted UI fixes installed')
          PY
      - name: Commit targeted branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add menu-fix.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix search icons, disclaimer, and featured providers"
          git push origin targeted-ui-fixes
