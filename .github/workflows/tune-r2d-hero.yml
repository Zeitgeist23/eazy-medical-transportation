name: Tune Ride2Dialysis Hero Balance

on:
  push:
    paths:
      - .r2d-tune-trigger

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten desktop hero proportions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ride2dialysis/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '.site-header{height:96px': '.site-header{height:82px',
            '.nav{display:flex;align-items:center;justify-content:space-between;gap:28px}': '.nav{display:flex;align-items:center;justify-content:space-between;gap:22px}',
            'font-size:clamp(25px,2vw,33px)': 'font-size:clamp(24px,1.85vw,31px)',
            '.brand-mark{width:58px;height:58px;flex:0 0 58px}': '.brand-mark{width:50px;height:50px;flex:0 0 50px}',
            '.desktop-nav{display:flex;align-items:center;gap:clamp(12px,1.5vw,28px)}': '.desktop-nav{display:flex;align-items:center;gap:clamp(10px,1.25vw,22px)}',
            '.desktop-nav a{text-decoration:none;font-weight:760;font-size:15px;padding:14px 4px;white-space:nowrap}': '.desktop-nav a{text-decoration:none;font-weight:760;font-size:14px;padding:11px 4px;white-space:nowrap}',
            'border-radius:9px;padding:14px 21px!important': 'border-radius:9px;padding:12px 18px!important',
            '.hero{position:relative;min-height:724px;overflow:hidden;background:#fff}': '.hero{position:relative;min-height:660px;overflow:hidden;background:#fff}',
            '.hero-photo{position:absolute;right:0;top:0;width:64%;height:100%;z-index:0}': '.hero-photo{position:absolute;right:0;top:0;width:45%;height:100%;z-index:0}',
            'object-fit:cover;object-position:58% center': 'object-fit:cover;object-position:52% center',
            'background:linear-gradient(90deg,#fff 0%,#fff 36%,rgba(255,255,255,.995) 42%,rgba(255,255,255,.94) 48%,rgba(255,255,255,.72) 54%,rgba(255,255,255,.35) 60%,rgba(255,255,255,0) 68%)': 'background:linear-gradient(90deg,#fff 0%,#fff 45%,rgba(255,255,255,.98) 48%,rgba(255,255,255,.86) 52%,rgba(255,255,255,.48) 56%,rgba(255,255,255,0) 61%)',
            '.hero-content{position:relative;z-index:2;padding-top:72px;padding-bottom:52px}': '.hero-content{position:relative;z-index:2;padding-top:56px;padding-bottom:46px}',
            '.hero-copy{width:540px;max-width:36vw}': '.hero-copy{width:min(650px,49vw);max-width:none}',
            'font-size:clamp(56px,4vw,68px)': 'font-size:clamp(54px,3.75vw,64px)',
            'max-width:500px;margin:28px 0 0': 'max-width:560px;margin:24px 0 0',
            '.finder{margin-top:22px;width:min(1005px,61vw)': '.finder{margin-top:26px;width:min(980px,62vw)'
          }
          for old, new in replacements.items():
              if old not in s:
                  print('missing:', old)
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hero balance update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride2dialysis/index.html
          git diff --cached --quiet || git commit -m "Rebalance Ride2Dialysis hero and navigation"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
