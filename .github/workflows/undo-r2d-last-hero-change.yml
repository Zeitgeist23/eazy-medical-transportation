name: Undo Last Ride2Dialysis Hero Change

on:
  push:
    paths:
      - .r2d-undo-trigger

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Ride2Dialysis files from immediately before the bad hero change
        run: |
          git checkout c0dc18b1a9a6e8f54b2c880d3ee26ee82d6c29ba^ -- ride2dialysis/index.html ride2dialysis/hero-photo.webp
      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ride2dialysis/index.html ride2dialysis/hero-photo.webp
          git diff --cached --quiet || git commit -m "Undo broken Ride2Dialysis hero change"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
