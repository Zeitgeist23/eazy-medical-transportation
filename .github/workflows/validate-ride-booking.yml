name: Validate EAZY ride booking script

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-ride-booking.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check ride-booking.js
      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-ride-booking.yml
          git commit -m "Remove temporary ride booking validation workflow"
          git push origin HEAD:main
