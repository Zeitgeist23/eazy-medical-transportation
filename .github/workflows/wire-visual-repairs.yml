name: Wire consolidated visual repairs

on:
  push:
    branches: [main]
    paths:
      - '.visual-repair-trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-all-visible-errors
      - name: Load consolidated repair controller
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="visual-fixes.js?v=8"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
      - name: Validate wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert '<script src="visual-fixes.js?v=8"></script>' in s
          assert Path('visual-fixes.js').exists()
          print('visual repairs wired')
          PY
      - name: Commit branch update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire consolidated visual repairs"
          git push origin repair-all-visible-errors
