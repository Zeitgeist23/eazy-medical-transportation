<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Accessible Eazy Medical Transportation van</title>
  <desc id="desc">A clean vector illustration of a medical transport van with a wheelchair-accessible ramp and care attendant.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8fc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dceff4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#148fb0"/>
      <stop offset="1" stop-color="#0a6e8b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b3d4f" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="36" fill="url(#sky)"/>
  <circle cx="760" cy="100" r="120" fill="#d7f3f8" opacity=".8"/>
