<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Reliable non-emergency medical transportation with care at every mile." />
  <title>Eazy Medical Transportation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; font-family: Arial, sans-serif; }
    .approved-page { position: relative; width: 100%; max-width: 1402px; margin: 0 auto; background: #fff; }
    #approved-design { display: block; width: 100%; height: auto; min-height: 60vh; object-fit: contain; }
    .loading { min-height: 70vh; display: grid; place-items: center; color: #087fa8; font-weight: 700; }
    .hotspot { position: absolute; z-index: 5; display: block; }
    .nav-services { left: 64%; top: 2.6%; width: 8%; height: 5%; }
    .nav-about { left: 72%; top: 2.6%; width: 7%; height: 5%; }
    .nav-contact { left: 79%; top: 2.6%; width: 7%; height: 5%; }
    .call-top { right: 2.8%; top: 2.1%; width: 11.5%; height: 6%; }
    .request { left: 3.3%; top: 42%; width: 14%; height: 6%; }
    .call-main { left: 18%; top: 42%; width: 15%; height: 6%; }
    .schedule { left: 34%; top: 42%; width: 15%; height: 6%; }
    @media (max-width: 700px) {
      .approved-page { overflow-x: hidden; }
      #approved-design { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="approved-page">
    <div id="loading" class="loading">Loading Eazy Medical Transportation…</div>
    <img id="approved-design" alt="Eazy Medical Transportation homepage" hidden />
    <a class="hotspot nav-services" href="#services" aria-label="Services"></a>
    <a class="hotspot nav-about" href="#about" aria-label="About"></a>
    <a class="hotspot nav-contact" href="mailto:info@eazymedicaltransportation.com" aria-label="Contact"></a>
    <a class="hotspot call-top" href="tel:+18477750516" aria-label="Call now"></a>
    <a class="hotspot request" href="mailto:info@eazymedicaltransportation.com?subject=Ride%20Request" aria-label="Request a ride"></a>
    <a class="hotspot call-main" href="tel:+18477750516" aria-label="Call now"></a>
    <a class="hotspot schedule" href="mailto:info@eazymedicaltransportation.com?subject=Schedule%20Transportation" aria-label="Schedule online"></a>
    <span id="services"></span><span id="about"></span>
  </main>
  <script>
    Promise.all([
      fetch('assets/hero-parts/part1.txt').then(r => { if (!r.ok) throw new Error('part1'); return r.text(); }),
      fetch('assets/hero-parts/part2.txt').then(r => { if (!r.ok) throw new Error('part2'); return r.text(); })
    ]).then(parts => {
      const image = document.getElementById('approved-design');
      image.src = 'data:image/jpeg;base64,' + parts.join('').replace(/\s/g, '');
      image.onload = () => {
        document.getElementById('loading').remove();
        image.hidden = false;
      };
    }).catch(() => {
      document.getElementById('loading').textContent = 'Please refresh the page.';
    });
  </script>
</body>
</html>
