<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Independent directory for non-emergency medical transportation providers.">
  <title>Independent Medical Transportation Directory</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;background:#fff}
    body{overflow-x:hidden}
    .directory-shell{width:100%;margin:0 auto;background:#fff}
    #directory-image{display:block;width:100%;height:auto;border:0}
    .loading{font-family:Arial,Helvetica,sans-serif;color:#0b5c72;text-align:center;padding:32px}
  </style>
</head>
<body>
  <main class="directory-shell">
    <div id="loading" class="loading">Loading directory…</div>
    <img id="directory-image" alt="Independent Medical Transportation Directory" hidden>
  </main>
  <script>
    const parts = [
      'directory-assets/final-00.txt',
      'directory-assets/final-01.txt',
      'directory-assets/final-02.txt',
      'directory-assets/final-03.txt',
      'directory-assets/final-04.txt',
      'directory-assets/final-05.txt'
    ];

    Promise.all(parts.map((path) => fetch(path, { cache: 'force-cache' }).then((response) => {
      if (!response.ok) throw new Error(`Could not load ${path}`);
      return response.text();
    })))
      .then((chunks) => {
        const image = document.getElementById('directory-image');
        image.src = 'data:image/png;base64,' + chunks.join('');
        image.hidden = false;
        document.getElementById('loading').remove();
      })
      .catch((error) => {
        console.error(error);
        document.getElementById('loading').textContent = 'Directory image could not be loaded.';
      });
  </script>
</body>
</html>
