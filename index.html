<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Independent directory for non-emergency medical transportation providers.">
<title>Independent Medical Transportation Directory</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#fff}
body{overflow-x:hidden;font-family:Arial,Helvetica,sans-serif}
.directory-shell{width:100%;margin:0;background:#fff}
.stage{position:relative;width:100%;margin:0}
#directory-image{display:block;width:100%;height:auto;margin:0;border:0}
#hero-scene-overlay{position:absolute;left:60.08%;top:7.73%;width:39.92%;height:28.18%;object-fit:fill;z-index:2;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;color:transparent;padding:0;margin:0;cursor:pointer;z-index:5}
.hotspot:focus-visible{outline:2px solid #087f96;outline-offset:2px}
.live-field{position:absolute;z-index:6;border:0;outline:0;background:transparent;color:transparent;font:500 clamp(8px,0.78vw,13px)/1 Arial,Helvetica,sans-serif;padding:0 .7%;appearance:none}
.live-field.has-value{background:#fff;color:#31536b}
.live-field:focus{background:#fff;color:#31536b}
#location{left:8.5%;top:28.15%;width:12.1%;height:2.75%}
#service{left:22.55%;top:28.15%;width:13.05%;height:2.75%}
#accessibility{left:37.65%;top:28.15%;width:12.65%;height:2.75%}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,32,43,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-backdrop.open{display:flex}
.modal{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.28);color:#173b57}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px;border-bottom:1px solid #d9e7eb}
.modal-head h2{margin:0;font-size:22px;color:#103f69}
.close{border:0;background:#eef7f9;color:#0c6f82;width:38px;height:38px;border-radius:50%;font-size:24px;cursor:pointer}
.modal-body{padding:18px 22px 24px}
.results{display:grid;gap:12px}
.result{border:1px solid #d8e8ed;border-radius:12px;padding:14px 16px}
.result h3{margin:0 0 5px;color:#123f68;font-size:17px}.result p{margin:4px 0;font-size:14px;line-height:1.4}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:#e4f5f7;color:#0b7180;border-radius:999px;padding:5px 9px;font-size:12px}
.notice{background:#f0f8fa;border-left:4px solid #0b8294;padding:11px 13px;margin-bottom:14px;font-size:13px;line-height:1.45}.notice a{color:#086f81;font-weight:800}
@media(max-width:700px){.modal-head h2{font-size:18px}.modal-body{padding:15px}.result h3{font-size:15px}}
</style>
</head>
<body>
<main class="directory-shell">
  <div class="stage" id="stage">
    <img id="directory-image" src="directory-landing-approved.png" alt="Independent Medical Transportation Directory">
    <img id="hero-scene-overlay" src="hero-scene-overlay.webp" alt="">

    <button class="hotspot" aria-label="Home" style="left:43.3%;top:4.35%;width:4.8%;height:3.6%" onclick="scrollRatio(0)"></button>
    <button class="hotspot" aria-label="Browse Providers" style="left:48.9%;top:4.35%;width:9.6%;height:3.6%" onclick="scrollRatio(.37)"></button>
    <button class="hotspot" aria-label="By State" style="left:59.7%;top:4.35%;width:7.1%;height:3.6%" onclick="showState()"></button>
    <button class="hotspot" aria-label="Wheelchair Vans" style="left:67.6%;top:4.35%;width:8.9%;height:3.6%" onclick="showWheelchair()"></button>
    <button class="hotspot" aria-label="About" style="left:77.4%;top:4.35%;width:4.8%;height:3.6%" onclick="scrollRatio(.82)"></button>
    <button class="hotspot" aria-label="Contact" style="left:82.9%;top:4.35%;width:5.2%;height:3.6%" onclick="scrollRatio(.84)"></button>

    <input id="location" class="live-field" aria-label="Location" autocomplete="postal-code" oninput="fieldState(this)">
    <select id="service" class="live-field" aria-label="Service type" onchange="fieldState(this)"><option value=""></option><option>Ambulatory</option><option>Wheelchair</option><option>Dialysis</option><option>Stretcher</option><option>Companion</option></select>
    <select id="accessibility" class="live-field" aria-label="Accessibility needs" onchange="fieldState(this)"><option value=""></option><option>Wheelchair</option><option>Stretcher</option><option>Ambulatory</option></select>
    <button class="hotspot" aria-label="Find Providers" style="left:51.45%;top:27.75%;width:8.15%;height:3.95%" onclick="runSearch()"></button>

    <button class="hotspot" aria-label="Browse all providers" style="left:83.7%;top:37.25%;width:10.6%;height:2.7%" onclick="showAll()"></button>
    <button class="hotspot" aria-label="View North Shore Medical Transport" style="left:5.9%;top:57.55%;width:10.0%;height:2.35%" onclick="showProvider(0)"></button>
    <button class="hotspot" aria-label="View Chicago Senior Ride Services" style="left:19.6%;top:57.55%;width:10.0%;height:2.35%" onclick="showProvider(1)"></button>
    <button class="hotspot" aria-label="View Lake County Wheelchair Transit" style="left:33.6%;top:57.55%;width:10.0%;height:2.35%" onclick="showProvider(2)"></button>
    <button class="hotspot" aria-label="View Suburban Patient Transport" style="left:47.2%;top:57.55%;width:10.0%;height:2.35%" onclick="showProvider(3)"></button>
    <button class="hotspot" aria-label="View Metro Dialysis Rides" style="left:60.7%;top:57.55%;width:10.0%;height:2.35%" onclick="showProvider(4)"></button>
    <button class="hotspot" aria-label="View Heartland Medical Transit" style="left:74.6%;top:57.55%;width:10.0%;height:2.35%" onclick="showProvider(5)"></button>

    <button class="hotspot" aria-label="Footer Home" style="left:23.9%;top:85.2%;width:7.4%;height:2%" onclick="scrollRatio(0)"></button>
    <button class="hotspot" aria-label="Footer Browse Providers" style="left:23.9%;top:87.1%;width:9%;height:2%" onclick="scrollRatio(.37)"></button>
    <button class="hotspot" aria-label="Footer By State" style="left:23.9%;top:88.9%;width:7%;height:2%" onclick="showState()"></button>
    <button class="hotspot" aria-label="Footer Wheelchair Vans" style="left:23.9%;top:90.7%;width:9%;height:2%" onclick="showWheelchair()"></button>
    <a class="hotspot" aria-label="Email directory" style="left:71.2%;top:86.1%;width:18%;height:2.1%" href="mailto:info@eazymedicaltransportation.com"></a>
  </div>
</main>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()">
  <section class="modal">
    <div class="modal-head"><h2 id="modalTitle">Directory</h2><button class="close" aria-label="Close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </section>
</div>

<script>
const providers=[
{name:'North Shore Medical Transport',city:'Evanston, IL',services:['Wheelchair','Ambulatory']},
{name:'Chicago Senior Ride Services',city:'Chicago, IL',services:['Ambulatory','Companion']},
{name:'Lake County Wheelchair Transit',city:'Waukegan, IL',services:['Wheelchair','Stretcher']},
{name:'Suburban Patient Transport',city:'Schaumburg, IL',services:['Ambulatory','Wheelchair']},
{name:'Metro Dialysis Rides',city:'Naperville, IL',services:['Dialysis','Wheelchair']},
{name:'Heartland Medical Transit',city:'Aurora, IL',services:['Ambulatory','Stretcher']}
];
const demoZipMap={'60201':'evanston','60601':'chicago','60085':'waukegan','60173':'schaumburg','60540':'naperville','60505':'aurora'};
function fieldState(el){el.classList.toggle('has-value',!!el.value)}
function scrollRatio(r){const s=document.getElementById('stage');window.scrollTo({top:s.offsetTop+s.offsetHeight*r,behavior:'smooth'})}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function cards(items){if(!items.length)return '<div class="notice">No matching providers are shown in this demonstration directory. Try a broader search.</div>';return '<div class="notice">Provider information should be verified independently before arranging transportation.</div><div class="results">'+items.map(p=>'<article class="result"><h3>'+p.name+'</h3><p>'+p.city+'</p><div class="tags">'+p.services.map(s=>'<span class="tag">'+s+'</span>').join('')+'</div></article>').join('')+'</div>'}
function runSearch(){const raw=document.getElementById('location').value.trim().toLowerCase();const loc=demoZipMap[raw]||raw;const service=document.getElementById('service').value;const access=document.getElementById('accessibility').value;let items=providers.filter(p=>(!loc||(p.city+' '+p.name).toLowerCase().includes(loc))&&(!service||p.services.includes(service))&&(!access||p.services.includes(access)));let html=cards(items);if(service==='Dialysis')html='<div class="notice"><strong>Dialysis-focused search:</strong> For recurring treatment transportation, you can also use <a href="https://www.ride2dialysis.com/">Ride2Dialysis.com</a>, the dialysis-focused companion to this directory.</div>'+html;openModal('Provider Search Results',html)}
function showAll(){openModal('Featured Providers',cards(providers))}
function showWheelchair(){openModal('Wheelchair Transportation Providers',cards(providers.filter(p=>p.services.includes('Wheelchair'))))}
function showState(){openModal('Browse Providers by State','<div class="notice">The providers currently displayed on this directory page are in Illinois.</div>'+cards(providers))}
function showProvider(i){const p=providers[i];let extra=p.services.includes('Dialysis')?'<div class="notice">Looking specifically for recurring dialysis transportation? Visit <a href="https://www.ride2dialysis.com/">Ride2Dialysis.com</a>.</div>':'';openModal(p.name,extra+'<div class="notice">This directory is independent. Verify provider availability, services, insurance acceptance, credentials, and contact information directly.</div><div class="result"><h3>'+p.name+'</h3><p><strong>Location:</strong> '+p.city+'</p><p><strong>Services shown:</strong> '+p.services.join(', ')+'</p></div>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})
(function hydrateFromQuery(){const q=new URLSearchParams(window.location.search);const location=q.get('location')||'';const service=q.get('service')||'';const accessibility=q.get('accessibility')||'';if(location){const el=document.getElementById('location');el.value=location;fieldState(el)}if(service&&[...document.getElementById('service').options].some(o=>o.value===service)){const el=document.getElementById('service');el.value=service;fieldState(el)}if(accessibility&&[...document.getElementById('accessibility').options].some(o=>o.value===accessibility)){const el=document.getElementById('accessibility');el.value=accessibility;fieldState(el)}if(location||service||accessibility)setTimeout(runSearch,150)})();
</script>
</body>
</html>
