<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eazy Medical Transportation</title>
  <meta name="description" content="Reliable non-emergency medical transportation with care at every mile.">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}.approved-wrap{position:relative;width:100%;max-width:1402px;margin:0 auto;overflow:hidden;background:#fff}.approved-wrap img{display:block;width:100%;height:auto}.loading{min-height:70vh;display:grid;place-items:center;color:#078fb9;font-weight:800}.number-cover{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;font-weight:800;color:#087fa8;line-height:1;background:#fff}.number-main{left:20.4%;top:45.3%;width:11.2%;height:2.6%;font-size:clamp(8px,1.05vw,15px)}.number-bottom{left:80.5%;top:72.0%;width:12.8%;height:2.9%;background:#edf9fd;font-size:clamp(8px,1.15vw,16px)}.hotspot{position:absolute;z-index:5;display:block}.call-top{right:2.8%;top:2.2%;width:11.3%;height:5.7%}.request{left:3.3%;top:42.3%;width:14%;height:6.1%}.call-main{left:18.2%;top:42.3%;width:14.5%;height:6.1%}.schedule{left:34%;top:42.3%;width:15%;height:6.1%}@media(max-width:700px){.number-main,.number-bottom{font-weight:700}}
  </style>
</head>
<body>
  <main class="approved-wrap">
    <div id="loading" class="loading">Loading Eazy Medical Transportation…</div>
    <img id="approved-design" alt="Eazy Medical Transportation homepage" hidden>
    <span class="number-cover number-main">000-000-0000</span>
    <span class="number-cover number-bottom">000-000-0000</span>
    <a class="hotspot call-top" href="tel:+0000000000" aria-label="Call now"></a>
    <a class="hotspot request" href="mailto:info@eazymedicaltransportation.com?subject=Ride%20Request" aria-label="Request a ride"></a>
    <a class="hotspot call-main" href="tel:+0000000000" aria-label="Call now"></a>
    <a class="hotspot schedule" href="mailto:info@eazymedicaltransportation.com?subject=Schedule%20Transportation" aria-label="Schedule online"></a>
  </main>
  <script>
    Promise.all([
      fetch('assets/hero-parts/part1.txt').then(r=>{if(!r.ok)throw new Error('part1');return r.text()}),
      fetch('assets/hero-parts/part2.txt').then(r=>{if(!r.ok)throw new Error('part2');return r.text()})
    ]).then(parts=>{
      const image=document.getElementById('approved-design');
      image.src='data:image/jpeg;base64,'+parts.join('').replace(/\s/g,'');
      image.onload=()=>{document.getElementById('loading').remove();image.hidden=false};
    }).catch(()=>{document.getElementById('loading').textContent='Please refresh the page.'});
  </script>
</body>
</html>
