<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Reliable non-emergency medical transportation with care at every mile.">
<title>Eazy Medical Transportation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#fff}
body{overflow-x:hidden}
.hero-page{position:relative;width:100%;margin:0 auto;background:#fff}
#landing{display:block;width:100%;height:auto;border:0}
.hotspot,.anchor{position:absolute;display:block;z-index:3;background:transparent;border:0;text-decoration:none}
.hotspot:focus-visible,.header-nav a:focus-visible{outline:3px solid rgba(0,145,190,.85);outline-offset:2px;border-radius:7px}
.header-nav{position:absolute;z-index:4;left:38.5%;right:4.7%;top:0;height:12.25%;background:#fff;display:flex;align-items:center;justify-content:flex-end;gap:clamp(20px,3.45vw,58px);font-family:Arial,Helvetica,sans-serif;color:#1b1b1b;white-space:nowrap;border-bottom:1px solid #eef1f3}
.header-nav a{position:relative;color:#1b1b1b;text-decoration:none;font-size:clamp(11px,.96vw,16px);font-weight:500;line-height:1;padding:12px 0;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}
.header-nav a.active{color:#0d6179}
.header-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;background:#0f7892;border-radius:2px}
.header-phone{display:inline-flex!important;align-items:center;gap:9px;padding:11px 23px!important;border:1px solid #d8dde1;border-radius:999px;color:#30343a!important;background:#fff;font-size:clamp(11px,.96vw,16px)!important}
.header-phone .phone-icon{font-size:1.05em;color:#08728d;line-height:1}
.logo-home{left:2.3%;top:1.2%;width:28%;height:9.5%}
.request-main{left:6.7%;top:62.5%;width:12.9%;height:5.8%}
.learn-main{left:20.9%;top:62.5%;width:12.2%;height:5.8%}
.badges{left:6.2%;top:72.2%;width:39.4%;height:10.8%}
.anchor{width:1px;height:1px;pointer-events:none}
#about{left:0;top:12.3%}
#services{left:0;top:84%}
@media(max-width:900px){.header-nav{left:36%;right:2.5%;gap:clamp(8px,2.3vw,24px)}.header-phone{padding:8px 12px!important;gap:6px}}
@media(max-width:650px){.header-nav{left:34%;right:1.5%;gap:7px}.header-nav a{font-size:8px;padding:6px 0}.header-phone{padding:5px 8px!important;font-size:8px!important}.hotspot:focus-visible,.header-nav a:focus-visible{outline-width:2px}}
</style>
</head>
<body>
<main class="hero-page">
  <img id="landing" src="eazy-hero.jpg" alt="Eazy Medical Transportation — reliable non-emergency medical transportation">

  <nav class="header-nav" aria-label="Primary navigation">
    <a class="active" href="/">Home</a>
    <a href="#services">Services</a>
    <a href="#about">About</a>
    <a href="mailto:info@eazymedicaltransportation.com?subject=Request%20a%20Ride">Request a Ride</a>
    <a href="mailto:info@eazymedicaltransportation.com?subject=Website%20Contact">Contact</a>
    <a class="header-phone" href="tel:+18477750516"><span class="phone-icon">☎</span><span>(847) 775-0516</span></a>
  </nav>

  <span id="about" class="anchor" aria-hidden="true"></span>
  <span id="services" class="anchor" aria-hidden="true"></span>

  <a class="hotspot logo-home" href="/" aria-label="Eazy Medical Transportation home"></a>
  <a class="hotspot request-main" href="mailto:info@eazymedicaltransportation.com?subject=Request%20a%20Ride" aria-label="Request a ride"></a>
  <a class="hotspot learn-main" href="#services" aria-label="Learn more about our services"></a>
  <a class="hotspot badges" href="#about" aria-label="Learn about Eazy Medical Transportation safety and service standards"></a>
</main>
</body>
</html>
