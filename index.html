<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eazy Medical Transportation</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;min-height:100%}
    body{overflow-x:hidden}
    #landing{display:block;width:100%;height:auto}
    #status{min-height:100vh;display:grid;place-items:center;font:600 18px Arial,sans-serif;color:#0b6e8a}
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <img id="landing" alt="" hidden>
  <script>
    (async()=>{
      const files=['assets/hero-parts/part1.txt','assets/hero-parts/part2.txt'];
      const parts=await Promise.all(files.map(async file=>{
        const response=await fetch(file,{cache:'no-store'});
        if(!response.ok) throw new Error(file+' '+response.status);
        return response.text();
      }));
      const base64=parts.join('').replace(/\s+/g,'');
      const binary=atob(base64);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));
      const image=document.getElementById('landing');
      image.onload=()=>{
        document.getElementById('status').remove();
        image.hidden=false;
        URL.revokeObjectURL(url);
      };
      image.src=url;
    })().catch(error=>{
      document.getElementById('status').textContent='Image could not load: '+error.message;
    });
  </script>
</body>
</html>
