<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Independent directory for non-emergency medical transportation providers.">
<title>Independent Medical Transportation Directory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:#fff}body{overflow-x:hidden;font-family:Arial,Helvetica,sans-serif}.directory-shell{width:100%;margin:0;background:#fff}.stage{position:relative;width:100%;margin:0}#directory-image{display:block;width:100%;height:auto;margin:0;border:0}.hotspot{position:absolute;border:0;background:transparent;color:transparent;padding:0;margin:0;cursor:pointer;z-index:5;touch-action:manipulation}.hotspot:focus-visible{outline:2px solid #087f96;outline-offset:2px}.live-field{position:absolute;z-index:6;border:0;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;font:500 clamp(8px,.78vw,13px)/1 Arial,Helvetica,sans-serif;padding:0 .7%;appearance:none;border-radius:5px}.live-field:focus,.live-field.has-value{background:#fff;color:#31536b;-webkit-text-fill-color:#31536b}.live-field:-webkit-autofill,.live-field:-webkit-autofill:hover,.live-field:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #fff inset!important;-webkit-text-fill-color:#31536b!important}
/* Search controls aligned to the current approved artwork */
#location{left:8.75%;top:28.95%;width:13.15%;height:3.85%}#service{left:23.0%;top:28.95%;width:14.6%;height:3.85%}#accessibility{left:38.6%;top:28.95%;width:13.35%;height:3.85%}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,32,43,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.open{display:flex}.modal{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.28);color:#173b57}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px;border-bottom:1px solid #d9e7eb}.modal-head h2{margin:0;font-size:22px;color:#103f69}.close{border:0;background:#eef7f9;color:#0c6f82;width:38px;height:38px;border-radius:50%;font-size:24px;cursor:pointer}.modal-body{padding:18px 22px 24px}.results{display:grid;gap:12px}.result{border:1px solid #d8e8ed;border-radius:12px;padding:14px 16px}.result h3{margin:0 0 5px;color:#123f68;font-size:17px}.result p{margin:4px 0;font-size:14px;line-height:1.4}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:#e4f5f7;color:#0b7180;border-radius:999px;padding:5px 9px;font-size:12px}.notice{background:#f0f8fa;border-left:4px solid #0b8294;padding:11px 13px;margin-bottom:14px;font-size:13px;line-height:1.45}.notice a{color:#086f81;font-weight:800}@media(max-width:700px){.modal-head h2{font-size:18px}.modal-body{padding:15px}.result h3{font-size:15px}}
</style>
</head>
<body>
<main class="directory-shell"><div class="stage" id="stage">
<img id="directory-image" src="directory-landing-approved.png" alt="Independent Medical Transportation Directory">

<!-- Top navigation: aligned to the current artwork -->
<button class="hotspot" aria-label="Home" style="left:44.55%;top:4.25%;width:4.8%;height:4.2%" onclick="scrollRatio(0)"></button>
<button class="hotspot" aria-label="Browse Providers" style="left:50.75%;top:4.25%;width:9.2%;height:4.2%" onclick="scrollRatio(.37)"></button>
<button class="hotspot" aria-label="By State" style="left:61.0%;top:4.25%;width:6.6%;height:4.2%" onclick="showState()"></button>
<button class="hotspot" aria-label="Wheelchair Vans" style="left:69.5%;top:4.25%;width:9.2%;height:4.2%" onclick="showWheelchair()"></button>
<button class="hotspot" aria-label="About" style="left:79.4%;top:4.25%;width:5.0%;height:4.2%" onclick="scrollRatio(.835)"></button>
<button class="hotspot" aria-label="Contact" style="left:85.4%;top:4.25%;width:5.2%;height:4.2%" onclick="scrollRatio(.865)"></button>

<!-- Real HTML search controls; the artwork beneath stays unchanged -->
<input id="location" class="live-field" name="directory-location" aria-label="Location" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" oninput="fieldState(this)">
<select id="service" class="live-field" aria-label="Service type" onchange="fieldState(this)"><option value=""></option><option>Ambulatory</option><option>Wheelchair</option><option>Dialysis</option><option>Doctor Visit</option><option>Stretcher</option><option>Companion</option></select>
<select id="accessibility" class="live-field" aria-label="Accessibility needs" onchange="fieldState(this)"><option value=""></option><option>Wheelchair</option><option>Stretcher</option><option>Ambulatory</option></select>
<button class="hotspot" aria-label="Find Providers" style="left:52.9%;top:28.85%;width:8.8%;height:4.35%" onclick="runSearch()"></button>

<!-- Provider actions realigned to the current artwork -->
<button class="hotspot" aria-label="Browse all providers" style="left:85.9%;top:40.45%;width:9.4%;height:2.8%" onclick="showAll()"></button>
<button class="hotspot" aria-label="View North Shore Medical Transport" style="left:6.3%;top:59.35%;width:10.3%;height:2.8%" onclick="showProvider(0)"></button>
<button class="hotspot" aria-label="View Chicago Senior Ride Services" style="left:20.2%;top:59.35%;width:10.5%;height:2.8%" onclick="showProvider(1)"></button>
<button class="hotspot" aria-label="View Lake County Wheelchair Transit" style="left:34.6%;top:59.35%;width:10.4%;height:2.8%" onclick="showProvider(2)"></button>
<button class="hotspot" aria-label="View Suburban Patient Transport" style="left:48.7%;top:59.35%;width:10.5%;height:2.8%" onclick="showProvider(3)"></button>
<button class="hotspot" aria-label="View Metro Dialysis Rides" style="left:62.1%;top:59.35%;width:10.5%;height:2.8%" onclick="showProvider(4)"></button>
<button class="hotspot" aria-label="View Heartland Medical Transit" style="left:76.1%;top:59.35%;width:10.5%;height:2.8%" onclick="showProvider(5)"></button>

<!-- Footer Quick Links -->
<button class="hotspot" aria-label="Footer Home" style="left:24.6%;top:85.5%;width:6.8%;height:2.2%" onclick="scrollRatio(0)"></button>
<button class="hotspot" aria-label="Footer Browse Providers" style="left:24.6%;top:87.8%;width:9.0%;height:2.2%" onclick="scrollRatio(.37)"></button>
<button class="hotspot" aria-label="Footer By State" style="left:24.6%;top:90.0%;width:6.6%;height:2.2%" onclick="showState()"></button>
<button class="hotspot" aria-label="Footer Wheelchair Vans" style="left:24.6%;top:92.2%;width:9.0%;height:2.2%" onclick="showWheelchair()"></button>

<!-- Resource Center links -->
<button class="hotspot" aria-label="What is NEMT" style="left:38.1%;top:85.5%;width:8.8%;height:2.2%" onclick="showInfo('What is NEMT?','Non-emergency medical transportation (NEMT) helps people travel to medical appointments when emergency transport is not required.')"></button>
<button class="hotspot" aria-label="Types of Services" style="left:38.1%;top:87.8%;width:9.2%;height:2.2%" onclick="showInfo('Types of Services','Directory listings may include ambulatory, wheelchair, stretcher, dialysis and companion transportation services.')"></button>
<button class="hotspot" aria-label="Tips for Choosing a Provider" style="left:38.1%;top:90.0%;width:12.0%;height:2.2%" onclick="showInfo('Tips for Choosing a Provider','Verify availability, service area, vehicle type, credentials, insurance acceptance and pricing directly with each provider.')"></button>
<button class="hotspot" aria-label="Frequently Asked Questions" style="left:38.1%;top:92.2%;width:12.5%;height:2.2%" onclick="showInfo('Frequently Asked Questions','Use the search controls above to narrow providers by location, service type and accessibility needs. Always verify provider information independently.')"></button>

<!-- Legal links -->
<button class="hotspot" aria-label="Terms of Use" style="left:54.5%;top:85.5%;width:7.0%;height:2.2%" onclick="showInfo('Terms of Use','This site is an independent informational directory. Provider information should be independently verified before arranging transportation.')"></button>
<button class="hotspot" aria-label="Privacy Policy" style="left:54.5%;top:87.8%;width:7.0%;height:2.2%" onclick="showInfo('Privacy Policy','Search entries are used to provide directory functionality. Do not submit sensitive medical information through the directory search fields.')"></button>
<button class="hotspot" aria-label="Disclaimer" style="left:54.5%;top:90.0%;width:6.5%;height:2.2%" onclick="showInfo('Disclaimer','EazyMedicalTransportation.com is an independent directory and is not affiliated with Eazy Medical Transportation LLC or any listed provider.')"></button>

<!-- Contact links -->
<a class="hotspot" aria-label="Email directory" style="left:72.8%;top:87.6%;width:18%;height:2.3%" href="mailto:info@eazymedicaltransportation.com"></a>
<a class="hotspot" aria-label="EazyMedicalTransportation.com" style="left:72.8%;top:90.3%;width:18%;height:2.3%" href="/" title="EazyMedicalTransportation.com"></a>
</div></main>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2 id="modalTitle">Directory</h2><button class="close" aria-label="Close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></section></div>

<script>
const providers=[
{name:'North Shore Medical Transport',city:'Evanston, IL',services:['Wheelchair','Ambulatory']},
{name:'Chicago Senior Ride Services',city:'Chicago, IL',services:['Ambulatory','Companion']},
{name:'Lake County Wheelchair Transit',city:'Waukegan, IL',services:['Wheelchair','Stretcher']},
{name:'Suburban Patient Transport',city:'Schaumburg, IL',services:['Ambulatory','Wheelchair']},
{name:'Metro Dialysis Rides',city:'Naperville, IL',services:['Dialysis','Wheelchair']},
{name:'Heartland Medical Transit',city:'Aurora, IL',services:['Ambulatory','Stretcher']}
];
const demoZipMap={'60201':'evanston','60601':'chicago','60085':'waukegan','60173':'schaumburg','60193':'schaumburg','60540':'naperville','60505':'aurora','32080':'st. augustine'};
function fieldState(el){el.classList.toggle('has-value',!!el.value)}
function scrollRatio(r){const s=document.getElementById('stage');window.scrollTo({top:s.offsetTop+s.offsetHeight*r,behavior:'smooth'})}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function showInfo(title,text){openModal(title,'<div class="notice">'+text+'</div>')}
function cards(items){if(!items.length)return '<div class="notice">No matching providers are shown in this demonstration directory. Try a broader search.</div>';return '<div class="notice">Provider information should be verified independently before arranging transportation.</div><div class="results">'+items.map(p=>'<article class="result"><h3>'+p.name+'</h3><p>'+p.city+'</p><div class="tags">'+p.services.map(s=>'<span class="tag">'+s+'</span>').join('')+'</div></article>').join('')+'</div>'}
function runSearch(){const raw=document.getElementById('location').value.trim().toLowerCase();const loc=demoZipMap[raw]||raw;const service=document.getElementById('service').value;const access=document.getElementById('accessibility').value;let items=providers.filter(p=>(!loc||(p.city+' '+p.name).toLowerCase().includes(loc))&&(!service||p.services.includes(service))&&(!access||p.services.includes(access)));let html=cards(items);if(service==='Dialysis')html='<div class="notice"><strong>Dialysis-focused search:</strong> For recurring treatment transportation, you can also use <a href="https://www.ride2dialysis.com/">Ride2Dialysis.com</a>, the dialysis-focused companion to this directory.</div>'+html;openModal('Provider Search Results',html)}
function showAll(){openModal('Featured Providers',cards(providers))}
function showWheelchair(){openModal('Wheelchair Transportation Providers',cards(providers.filter(p=>p.services.includes('Wheelchair'))))}
function showState(){openModal('Browse Providers by State','<div class="notice">The providers currently displayed on this directory page are in Illinois.</div>'+cards(providers))}
function showProvider(i){const p=providers[i];let extra=p.services.includes('Dialysis')?'<div class="notice">Looking specifically for recurring dialysis transportation? Visit <a href="https://www.ride2dialysis.com/">Ride2Dialysis.com</a>.</div>':'';openModal(p.name,extra+'<div class="notice">This directory is independent. Verify provider availability, services, insurance acceptance, credentials, and contact information directly.</div><div class="result"><h3>'+p.name+'</h3><p><strong>Location:</strong> '+p.city+'</p><p><strong>Services shown:</strong> '+p.services.join(', ')+'</p></div>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(function hydrateFromQuery(){const q=new URLSearchParams(window.location.search);const location=q.get('location')||'';const service=q.get('service')||'';const accessibility=q.get('accessibility')||'';if(location){const el=document.getElementById('location');el.value=location;fieldState(el)}if(service&&[...document.getElementById('service').options].some(o=>o.value===service)){const el=document.getElementById('service');el.value=service;fieldState(el)}if(accessibility&&[...document.getElementById('accessibility').options].some(o=>o.value===accessibility)){const el=document.getElementById('accessibility');el.value=accessibility;fieldState(el)}if(location||service||accessibility)setTimeout(runSearch,150)})();
</script>
</body></html>
