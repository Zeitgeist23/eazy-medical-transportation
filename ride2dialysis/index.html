<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ride2Dialysis.com helps dialysis patients find independent medical transportation providers.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.ride2dialysis.com/">
<title>Ride2Dialysis.com | Dialysis Transportation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif}
.page{width:100vw;max-width:none;margin:0;background:#fff;position:relative}
.approved{display:block;width:100vw;max-width:none;height:auto;margin:0}
.loading{height:100vh;display:grid;place-items:center;color:#087f91;font:600 16px Arial,sans-serif}
.error{padding:40px;text-align:center;color:#123}
.hotspot{position:absolute;z-index:3;background:transparent;border:0;cursor:pointer}
.hotspot:focus-visible{outline:3px solid #0b8292;outline-offset:2px}
.home{left:38.2%;top:1.55%;width:5%;height:2.7%}
.find{left:45%;top:1.55%;width:7%;height:2.7%}
.providers{left:53.4%;top:1.55%;width:8%;height:2.7%}
.cities{left:62.2%;top:1.55%;width:5.5%;height:2.7%}
.how{left:68.5%;top:1.55%;width:8.5%;height:2.7%}
.contact{left:78.1%;top:1.55%;width:6%;height:2.7%}
.findbtn{left:84.7%;top:1.0%;width:11.7%;height:3.5%}
.search{left:53.5%;top:20.0%;width:9.4%;height:3.4%}
.viewall{left:82.0%;top:50.2%;width:13.3%;height:2.5%}
@media(max-width:700px){.page,.approved{width:100%;max-width:none}.hotspot{display:none}}
</style>
</head>
<body>
<div id="loading" class="loading">Loading Ride2Dialysis.com…</div>
<main id="page" class="page" hidden>
<img id="approved" class="approved" alt="Ride2Dialysis.com dialysis transportation directory homepage">
<button class="hotspot home" aria-label="Home" onclick="scrollTo({top:0,behavior:'smooth'})"></button>
<button class="hotspot find" aria-label="Find a Ride" onclick="scrollToSearch()"></button>
<button class="hotspot providers" aria-label="Providers" onclick="scrollToProviders()"></button>
<button class="hotspot cities" aria-label="Cities" onclick="scrollToCities()"></button>
<button class="hotspot how" aria-label="How It Works" onclick="scrollToHow()"></button>
<button class="hotspot contact" aria-label="Contact" onclick="scrollTo({top:document.body.scrollHeight,behavior:'smooth'})"></button>
<button class="hotspot findbtn" aria-label="Find Providers" onclick="scrollToSearch()"></button>
<button class="hotspot search" aria-label="Search providers" onclick="scrollToProviders()"></button>
<button class="hotspot viewall" aria-label="View all providers" onclick="scrollToProviders()"></button>
</main>
<script>
const N=9;
const y=r=>Math.round(document.documentElement.scrollHeight*r);
function scrollToSearch(){scrollTo({top:y(.12),behavior:'smooth'})}
function scrollToHow(){scrollTo({top:y(.35),behavior:'smooth'})}
function scrollToProviders(){scrollTo({top:y(.49),behavior:'smooth'})}
function scrollToCities(){scrollTo({top:y(.82),behavior:'smooth'})}
Promise.all(Array.from({length:N},(_,i)=>fetch('approved-image.0'+i,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('asset '+i);return r.text()})))
.then(parts=>{const img=document.getElementById('approved');img.onload=()=>{document.getElementById('loading').remove();document.getElementById('page').hidden=false};img.src='data:image/webp;base64,'+parts.join('').replace(/\s/g,'')})
.catch(()=>{document.getElementById('loading').className='error';document.getElementById('loading').textContent='Ride2Dialysis.com is temporarily unavailable.'});
</script>
</body>
</html>
